name: Bug report
description: Report a reproducible problem in Podlaz
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, subscription URLs, private endpoints, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: Podlaz version
      description: Output of `podlaz version`, or the commit SHA if building from source.
      placeholder: v0.2.x
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Debian package
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution/version and architecture.
      placeholder: Debian 13, amd64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce the problem.
      placeholder: |
        1. Run ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostics
      description: Add relevant logs or command output after removing sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing open and closed issues for duplicates.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
