  attest-and-publish:
    name: Attest and publish GitHub Release
    needs:
      - resolve
      - build
      - installed-runtime
      - synthetic-tun
      - remnawave-proxy
      - terminal-boot
      - wifi-lifecycle
      - boot-authority
      - suspend-resume
      - reboot-autostart-disabled
      - boot-continuation-ordering
      - release-daemon-recovery
      - release-xray-replacement
      - release-network-apply-rollback
      - release-network-verify-rollback
      - release-terminal-failure-convergence
      - release-network-reconciliation
      - release-stale-observation
      - release-foreign-state-safety
      - release-protected-gateway-lifecycle
      - release-precommit-interruption
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Download qualified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Verify exact qualified release artifact handoff
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release_manifest_sha256 }}
        run: bash scripts/ci/verify-release-artifacts.sh

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.deb
            dist/release/SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          BUILT_DATE: ${{ needs.build.outputs.built_date }}
        run: |
          set -euo pipefail
          notes="$(cat <<EOF
          Podlaz ${VERSION}

          Release commit: ${COMMIT_SHA}
          Built: ${BUILT_DATE}

          Install / upgrade: https://github.com/${GH_REPO}#install
          Upgrade / rollback / uninstall: https://github.com/${GH_REPO}#recovery-upgrade-and-removal
          Verify downloaded artifacts against SHA256SUMS and the GitHub build-provenance attestations documented in the README.
          EOF
          )"
          expected_assets=(
            "podlaz_${VERSION}_linux_amd64.tar.gz"
            "podlaz_${VERSION}_linux_arm64.tar.gz"
            "podlaz_${VERSION}_linux_amd64.deb"
            "podlaz_${VERSION}_linux_arm64.deb"
            "SHA256SUMS"
          )
          release_asset_paths=()
          for asset in "${expected_assets[@]}"; do
            release_asset_paths+=("dist/release/${asset}")
          done

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              "${release_asset_paths[@]}" \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes \
              --notes "${notes}"
            exit 0
          fi

          mapfile -t existing_assets < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
          matching_expected_asset_count=0
          for expected_asset in "${expected_assets[@]}"; do
            for existing_asset in "${existing_assets[@]}"; do
              if [ "${existing_asset}" = "${expected_asset}" ]; then
                matching_expected_asset_count=$((matching_expected_asset_count + 1))
                break
              fi
            done
          done

          if [ "${matching_expected_asset_count}" -eq 0 ]; then
            gh release upload "${TAG}" "${release_asset_paths[@]}"
            exit 0
          fi

          if [ "${matching_expected_asset_count}" -ne "${#expected_assets[@]}" ]; then
            echo "release ${TAG} already has a partial set of expected immutable assets" >&2
            echo "remove the incomplete release assets manually or publish a new tag" >&2
            exit 1
          fi

          download_dir="$(mktemp -d)"
          trap 'rm -rf "${download_dir}"' EXIT
          for expected_asset in "${expected_assets[@]}"; do
            gh release download "${TAG}" --pattern "${expected_asset}" --dir "${download_dir}"
          done
          (
            cd "${download_dir}"
            sha256sum -c SHA256SUMS
          )
          if cmp -s "dist/release/SHA256SUMS" "${download_dir}/SHA256SUMS"; then
            echo "release ${TAG} already has matching immutable assets"
            exit 0
          fi

          echo "release ${TAG} already has expected assets, but SHA256SUMS differs" >&2
          echo "release assets are immutable; publish a new tag instead of replacing them" >&2
          exit 1


  apt-repository:
    name: Publish signed APT repository
    if: ${{ vars.PODLAZ_APT_PUBLISH_ENABLED == 'true' }}
    needs:
      - resolve
      - build
      - attest-and-publish
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt-repository.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      commit_sha: ${{ needs.build.outputs.commit_sha }}
      release_manifest_sha256: ${{ needs.build.outputs.release_manifest_sha256 }}
