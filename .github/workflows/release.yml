name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release-vars.outputs.tag }}
      version: ${{ steps.release-vars.outputs.version }}
    steps:
      - name: Resolve release version
        id: release-vars
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "release tag must use vMAJOR.MINOR.PATCH, got: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test release commit
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Go fmt, test, and vet
        run: bash scripts/ci/go-core.sh

      - name: Govulncheck
        run: |
          bash scripts/ci/install-go-tool.sh govulncheck
          govulncheck ./...

  build:
    name: Build and validate release artifacts
    needs:
      - resolve
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      commit_sha: ${{ steps.release-commit.outputs.commit_sha }}
      built_date: ${{ steps.release-commit.outputs.built_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Resolve release commit
        id: release-commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          built_date="$(git show -s --format=%cd --date=format:'%Y-%m-%d' HEAD)"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "built_date=${built_date}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg file lintian man-db zsh fish gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build Debian packages
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_SHA: ${{ steps.release-commit.outputs.commit_sha }}
          BUILT_DATE: ${{ steps.release-commit.outputs.built_date }}
        run: bash scripts/ci/build-release-packages.sh

      - name: Validate package metadata and contents
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_LINKAGE_ROOT: dist/package-root
        run: |
          bash scripts/ci/validate-packages.sh \
            "dist/podlaz_${VERSION}_linux_amd64.deb" \
            "dist-arm64/podlaz_${VERSION}_linux_arm64.deb"

      - name: Install, reinstall, and purge package locally
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_EXPECT_VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_EXPECT_COMMIT: ${{ steps.release-commit.outputs.commit_sha }}
          PODLAZ_EXPECT_BUILT: ${{ steps.release-commit.outputs.built_date }}
        run: |
          PODLAZ_VALIDATE_SERVICE=1 \
            bash scripts/ci/validate-package-install.sh "dist/podlaz_${VERSION}_linux_amd64.deb"

      - name: Create release artifacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/ci/create-release-artifacts.sh

      - name: Upload release artifacts for qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: |
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.deb
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  tun-smoke:
    name: Exact-package TUN smoke
    needs:
      - resolve
      - build
    runs-on: [self-hosted, linux, x64, vpn-e2e, ubuntu-24.04]
    environment: vpn-e2e
    timeout-minutes: 60
    env:
      PODLAZ_E2E_PROFILE_URI: ${{ secrets.PODLAZ_E2E_PROFILE_URI }}
      PODLAZ_E2E_EXPECTED_EGRESS_IP: ${{ secrets.PODLAZ_E2E_EXPECTED_EGRESS_IP }}
      PODLAZ_E2E_PUBLIC_IP_CHECK_URL: ${{ vars.PODLAZ_E2E_PUBLIC_IP_CHECK_URL }}
      PODLAZ_E2E_DNS_CHECK_HOST: ${{ vars.PODLAZ_E2E_DNS_CHECK_HOST }}
      PODLAZ_E2E_EXPECT_COMMIT: ${{ needs.build.outputs.commit_sha }}
      PODLAZ_E2E_ENABLE_LIFECYCLE: 'true'
      PODLAZ_E2E_ENABLE_TUN: 'true'
      PODLAZ_E2E_KEEP_PACKAGE: 'true'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-release-smoke

      - name: Run exact-package TUN smoke
        shell: bash
        env:
          PODLAZ_E2E_DEB_PATH: ${{ runner.temp }}/podlaz-release-smoke/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
        run: |
          set -euo pipefail
          test -n "${PODLAZ_E2E_PROFILE_URI}"
          test -n "${PODLAZ_E2E_EXPECTED_EGRESS_IP}"
          test -f "${PODLAZ_E2E_DEB_PATH}"
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          bash scripts/e2e/real-vpn.sh

      - name: Recover and purge smoke package state
        if: always()
        timeout-minutes: 20
        shell: bash
        run: |
          PODLAZ_E2E_PURGE_PACKAGE=true \
            timeout --signal=TERM --kill-after=30s 900s \
            bash scripts/e2e/tun-package-cleanup.sh

      - name: Remove private smoke evidence
        if: always()
        shell: bash
        run: |
          sudo -n rm -rf "${RUNNER_TEMP}/podlaz-e2e-tmp"
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-release-smoke"

  installed-runtime:
    name: Qualify exact installed package
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Install exact release package
        run: |
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          sudo -n apt install -y "./dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb"
          sudo -n systemctl daemon-reload
          sudo -n systemctl reset-failed podlazd.service >/dev/null 2>&1 || true
          sudo -n systemctl start podlazd.service
          sudo -n systemctl is-active --quiet podlazd.service

      - name: Run exact-package runtime acceptance
        run: |
          bash scripts/e2e/log-window-acceptance.sh
          bash scripts/e2e/remote-client-acceptance.sh

      - name: Purge exact release package
        if: always()
        run: |
          sudo -n systemctl stop podlazd.service >/dev/null 2>&1 || true
          sudo -n apt purge -y podlaz >/dev/null 2>&1 || true
          if command -v deb-systemd-helper >/dev/null 2>&1; then
            sudo -n deb-systemd-helper purge podlazd.service >/dev/null 2>&1 || true
          fi
          sudo -n systemctl daemon-reload >/dev/null 2>&1 || true
          sudo -n systemctl reset-failed podlazd.service >/dev/null 2>&1 || true

      - name: Upload exact-package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-release-installed-runtime-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  real-provider:
    name: Qualify exact real proxy data plane
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    environment: vpn-e2e
    timeout-minutes: 90
    env:
      PODLAZ_E2E_PROFILE_URI: ${{ secrets.PODLAZ_E2E_PROFILE_URI }}
      PODLAZ_E2E_PROFILE_URI_LIST: ${{ secrets.PODLAZ_E2E_PROFILE_URI_LIST }}
      PODLAZ_E2E_EXPECTED_EGRESS_IP: ${{ secrets.PODLAZ_E2E_EXPECTED_EGRESS_IP }}
      PODLAZ_E2E_PUBLIC_IP_CHECK_URL: ${{ vars.PODLAZ_E2E_PUBLIC_IP_CHECK_URL }}
      PODLAZ_E2E_RELIABILITY_CYCLES: ${{ vars.PODLAZ_E2E_RELEASE_RELIABILITY_CYCLES || '10' }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Run exact-package real proxy data-plane integration
        id: data_plane
        env:
          PODLAZ_E2E_PACKAGE_PATH: ${{ github.workspace }}/dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-e2e-tmp/real-provider-artifacts
        run: |
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          bash scripts/e2e/data-plane.sh

      - name: Purge package state
        id: cleanup
        if: always()
        run: |
          sudo -n systemctl stop podlazd.service >/dev/null 2>&1 || true
          sudo -n apt purge -y podlaz >/dev/null 2>&1 || true
          if command -v deb-systemd-helper >/dev/null 2>&1; then
            sudo -n deb-systemd-helper purge podlazd.service >/dev/null 2>&1 || true
          fi
          sudo -n systemctl daemon-reload >/dev/null 2>&1 || true
          sudo -n systemctl reset-failed podlazd.service >/dev/null 2>&1 || true

      - name: Prepare public result
        if: always()
        env:
          DATA_PLANE_OUTCOME: ${{ steps.data_plane.outcome }}
        run: |
          mkdir -p "${RUNNER_TEMP}/podlaz-e2e-artifacts"
          printf 'real-provider data-plane: %s\n' "${DATA_PLANE_OUTCOME}" \
            >"${RUNNER_TEMP}/podlaz-e2e-artifacts/real-provider-result.txt"

      - name: Scan public artifacts
        id: evidence_scan
        if: always()
        run: bash scripts/e2e/scan-public-artifacts.sh

      - name: Remove private E2E temp state
        id: private_cleanup
        if: always()
        run: sudo -n rm -rf "${RUNNER_TEMP}/podlaz-e2e-tmp"

      - name: Upload exact data-plane diagnostics
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.evidence_scan.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-release-real-provider-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  attest-and-publish:
    name: Attest and publish GitHub Release
    needs:
      - resolve
      - build
      - tun-smoke
      - installed-runtime
      - real-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download qualified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.deb
            dist/release/SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          BUILT_DATE: ${{ needs.build.outputs.built_date }}
        run: |
          set -euo pipefail
          printf -v notes 'podlaz %s\n\nTag: %s\nCommit: %s\nBuilt: %s' "${VERSION}" "${TAG}" "${COMMIT_SHA}" "${BUILT_DATE}"
          expected_assets=(
            "podlaz_${VERSION}_linux_amd64.tar.gz"
            "podlaz_${VERSION}_linux_arm64.tar.gz"
            "podlaz_${VERSION}_linux_amd64.deb"
            "podlaz_${VERSION}_linux_arm64.deb"
            "SHA256SUMS"
          )
          release_asset_paths=()
          for asset in "${expected_assets[@]}"; do
            release_asset_paths+=("dist/release/${asset}")
          done

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              "${release_asset_paths[@]}" \
              --verify-tag \
              --title "${TAG}" \
              --notes "${notes}"
            exit 0
          fi

          mapfile -t existing_assets < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
          matching_expected_asset_count=0
          for expected_asset in "${expected_assets[@]}"; do
            for existing_asset in "${existing_assets[@]}"; do
              if [ "${existing_asset}" = "${expected_asset}" ]; then
                matching_expected_asset_count=$((matching_expected_asset_count + 1))
                break
              fi
            done
          done

          if [ "${matching_expected_asset_count}" -eq 0 ]; then
            gh release edit "${TAG}" --title "${TAG}" --notes "${notes}"
            gh release upload "${TAG}" "${release_asset_paths[@]}"
            exit 0
          fi

          if [ "${matching_expected_asset_count}" -ne "${#expected_assets[@]}" ]; then
            echo "release ${TAG} already has a partial set of expected immutable assets" >&2
            echo "remove the incomplete release assets manually or publish a new tag" >&2
            exit 1
          fi

          download_dir="$(mktemp -d)"
          trap 'rm -rf "${download_dir}"' EXIT
          for expected_asset in "${expected_assets[@]}"; do
            gh release download "${TAG}" --pattern "${expected_asset}" --dir "${download_dir}"
          done
          (
            cd "${download_dir}"
            sha256sum -c SHA256SUMS
          )
          if cmp -s "dist/release/SHA256SUMS" "${download_dir}/SHA256SUMS"; then
            gh release edit "${TAG}" --title "${TAG}" --notes "${notes}"
            echo "release ${TAG} already has matching immutable assets"
            exit 0
          fi

          echo "release ${TAG} already has expected assets, but SHA256SUMS differs" >&2
          echo "release assets are immutable; publish a new tag instead of replacing them" >&2
          exit 1
