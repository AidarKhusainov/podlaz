name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to qualify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release-vars.outputs.tag }}
      version: ${{ steps.release-vars.outputs.version }}
    steps:
      - name: Resolve release version
        id: release-vars
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          version="${tag#v}"
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "release tag must use vMAJOR.MINOR.PATCH, got: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test release commit
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Go fmt, test, and vet
        run: bash scripts/ci/go-core.sh

      - name: Govulncheck
        run: |
          bash scripts/ci/install-go-tool.sh govulncheck
          govulncheck ./...

  build:
    name: Build and validate release artifacts
    needs:
      - resolve
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      commit_sha: ${{ steps.release-commit.outputs.commit_sha }}
      built_date: ${{ steps.release-commit.outputs.built_date }}
      release_manifest_sha256: ${{ steps.release-manifest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Resolve release commit
        id: release-commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          built_date="$(git show -s --format=%cd --date=format:'%Y-%m-%d' HEAD)"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "built_date=${built_date}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg file lintian man-db zsh fish gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build Debian packages
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_SHA: ${{ steps.release-commit.outputs.commit_sha }}
          BUILT_DATE: ${{ steps.release-commit.outputs.built_date }}
        run: bash scripts/ci/build-release-packages.sh

      - name: Validate package metadata and contents
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_LINKAGE_ROOT: dist/package-root
        run: |
          bash scripts/ci/validate-packages.sh \
            "dist/podlaz_${VERSION}_linux_amd64.deb" \
            "dist-arm64/podlaz_${VERSION}_linux_arm64.deb"

      - name: Install, reinstall, and purge package locally
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_EXPECT_VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_EXPECT_COMMIT: ${{ steps.release-commit.outputs.commit_sha }}
          PODLAZ_EXPECT_BUILT: ${{ steps.release-commit.outputs.built_date }}
        run: |
          PODLAZ_VALIDATE_SERVICE=1 \
            bash scripts/ci/validate-package-install.sh "dist/podlaz_${VERSION}_linux_amd64.deb"

      - name: Create release artifacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/ci/create-release-artifacts.sh

      - name: Capture exact release artifact manifest digest
        id: release-manifest
        run: |
          set -euo pipefail
          printf 'sha256=%s\n' "$(sha256sum dist/release/SHA256SUMS | awk '{print $1}')" >>"${GITHUB_OUTPUT}"

      - name: Upload release artifacts for qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: |
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.deb
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  installed-runtime:
    name: Qualify exact installed package
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Verify exact release artifact handoff
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release_manifest_sha256 }}
        run: bash scripts/ci/verify-release-artifacts.sh

      - name: Install exact release package
        run: |
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          sudo -n apt install -y "./dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb"
          sudo -n systemctl daemon-reload
          sudo -n systemctl reset-failed podlazd.service >/dev/null 2>&1 || true
          sudo -n systemctl start podlazd.service
          sudo -n systemctl is-active --quiet podlazd.service

      - name: Run exact-package runtime acceptance
        run: |
          bash scripts/e2e/log-window-acceptance.sh
          bash scripts/e2e/remote-client-acceptance.sh

      - name: Purge exact release package
        if: always()
        run: |
          sudo -n systemctl stop podlazd.service >/dev/null 2>&1 || true
          sudo -n apt purge -y podlaz >/dev/null 2>&1 || true
          if command -v deb-systemd-helper >/dev/null 2>&1; then
            sudo -n deb-systemd-helper purge podlazd.service >/dev/null 2>&1 || true
          fi
          sudo -n systemctl daemon-reload >/dev/null 2>&1 || true
          sudo -n systemctl reset-failed podlazd.service >/dev/null 2>&1 || true

      - name: Upload exact-package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-release-installed-runtime-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  synthetic-tun:
    name: Qualify exact synthetic full-TUN package (${{ matrix.protocol }})
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        protocol: [vless, vmess, trojan, shadowsocks, hysteria2]
    env:
      PODLAZ_E2E_SYNTHETIC_PROTOCOL: ${{ matrix.protocol }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Verify exact release artifact handoff
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release_manifest_sha256 }}
        run: bash scripts/ci/verify-release-artifacts.sh

      - name: Install synthetic TUN qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap jq nftables systemd-container iptables

      - name: Run exact-package synthetic full-TUN qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-synthetic-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-synthetic-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ needs.build.outputs.commit_sha }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-synthetic-tun.sh "dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb"

      - name: Validate synthetic TUN public verdict
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-synthetic-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-synthetic-public
        run: bash scripts/e2e/hosted-synthetic-tun.sh validate-report

      - name: Remove private synthetic TUN state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-synthetic-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload synthetic TUN release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-release-synthetic-tun-${{ matrix.protocol }}-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-release-synthetic-public/hosted-synthetic-tun.txt
          if-no-files-found: error
          retention-days: 7

  remnawave-proxy:
    name: Qualify exact ephemeral Remnawave proxy data plane
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PODLAZ_E2E_RELIABILITY_CYCLES: ${{ vars.PODLAZ_E2E_RELEASE_RELIABILITY_CYCLES || '10' }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Verify exact release artifact handoff
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release_manifest_sha256 }}
        run: bash scripts/ci/verify-release-artifacts.sh

      - name: Run exact-package ephemeral Remnawave proxy qualification
        id: qualification
        env:
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ needs.build.outputs.commit_sha }}
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-remnawave-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-remnawave-public
          PODLAZ_E2E_RELIABILITY_CYCLES: ${{ env.PODLAZ_E2E_RELIABILITY_CYCLES }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/remnawave-proxy-acceptance.sh             "dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb"

      - name: Purge package state
        id: cleanup
        if: always()
        run: |
          sudo -n systemctl stop podlazd.service >/dev/null 2>&1 || true
          sudo -n apt purge -y podlaz >/dev/null 2>&1 || true
          if command -v deb-systemd-helper >/dev/null 2>&1; then
            sudo -n deb-systemd-helper purge podlazd.service >/dev/null 2>&1 || true
          fi
          sudo -n systemctl daemon-reload >/dev/null 2>&1 || true
          sudo -n systemctl reset-failed podlazd.service >/dev/null 2>&1 || true

      - name: Validate Remnawave proxy public evidence
        id: evidence_scan
        if: always()
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-remnawave-public
        run: bash scripts/e2e/scan-remnawave-artifacts.sh proxy

      - name: Remove private Remnawave state
        id: private_cleanup
        if: always()
        run: sudo -n rm -rf "${RUNNER_TEMP}/podlaz-release-remnawave-private"

      - name: Upload exact Remnawave proxy evidence
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.evidence_scan.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-release-remnawave-proxy-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-release-remnawave-public/remnawave-proxy.txt
          if-no-files-found: error
          retention-days: 7

  wifi-lifecycle:
    name: Qualify exact release Wi-Fi lifecycle
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Verify exact release artifact handoff
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release_manifest_sha256 }}
        run: bash scripts/ci/verify-release-artifacts.sh

      - name: Install VM qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cloud-image-utils openssh-client qemu-system-x86 qemu-utils

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedVMWiFiLifecycle' -count=1

      - name: Run exact-package Wi-Fi lifecycle qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-wifi-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-wifi-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ needs.build.outputs.commit_sha }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-vm-wifi-lifecycle.sh "dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb"

      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-wifi-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-wifi-public
        run: bash scripts/e2e/hosted-vm-wifi-lifecycle.sh validate-report

      - name: Remove private VM state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-wifi-private
        run: rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: podlaz-release-wifi-lifecycle-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-release-wifi-public/hosted-vm-wifi-lifecycle.txt
          if-no-files-found: error
          retention-days: 7

  terminal-boot:
    name: Qualify exact release terminal boot lifecycle
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Verify exact release artifact handoff
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release_manifest_sha256 }}
        run: bash scripts/ci/verify-release-artifacts.sh

      - name: Install VM qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cloud-image-utils jq nftables openssh-client qemu-system-x86 qemu-utils

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedVMTerminalBoot' -count=1

      - name: Run exact-package terminal boot qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-terminal-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-terminal-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ needs.build.outputs.commit_sha }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-vm-terminal-boot.sh "dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb"

      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-terminal-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-terminal-public
        run: bash scripts/e2e/hosted-vm-terminal-boot.sh validate-report

      - name: Remove private VM state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-terminal-private
        run: rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: podlaz-release-terminal-boot-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-release-terminal-public/hosted-vm-terminal-boot.txt
          if-no-files-found: error
          retention-days: 7

  boot-authority:
    name: Qualify exact release boot authority lifecycle
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Verify exact release artifact handoff
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release_manifest_sha256 }}
        run: bash scripts/ci/verify-release-artifacts.sh

      - name: Install VM qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cloud-image-utils iptables jq nftables openssh-client qemu-system-x86 qemu-utils

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedVMBootAuthority' -count=1

      - name: Run exact-package boot authority qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-boot-authority-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-boot-authority-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ needs.build.outputs.commit_sha }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-vm-boot-authority.sh "dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb"

      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-boot-authority-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-release-boot-authority-public
        run: bash scripts/e2e/hosted-vm-boot-authority.sh validate-report

      - name: Remove private VM state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-release-boot-authority-private
        run: rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: podlaz-release-boot-authority-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/podlaz-release-boot-authority-public/hosted-vm-boot-authority.txt
          if-no-files-found: error
