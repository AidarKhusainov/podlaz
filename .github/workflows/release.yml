name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release-vars.outputs.tag }}
      version: ${{ steps.release-vars.outputs.version }}
    steps:
      - name: Resolve release version
        id: release-vars
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "release tag must use vMAJOR.MINOR.PATCH, got: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test release commit
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Go fmt, test, and vet
        run: bash scripts/ci/go-core.sh

      - name: Govulncheck
        run: |
          bash scripts/ci/install-go-tool.sh govulncheck
          govulncheck ./...

  build:
    name: Build and validate release artifacts
    needs:
      - resolve
      - test
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    outputs:
      commit_sha: ${{ steps.release-commit.outputs.commit_sha }}
      built_date: ${{ steps.release-commit.outputs.built_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Resolve release commit
        id: release-commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          built_date="$(git show -s --format=%cd --date=format:'%Y-%m-%d' HEAD)"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "built_date=${built_date}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg file lintian man-db zsh fish gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build Debian packages
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_SHA: ${{ steps.release-commit.outputs.commit_sha }}
          BUILT_DATE: ${{ steps.release-commit.outputs.built_date }}
        run: bash scripts/ci/build-release-packages.sh

      - name: Validate package metadata and contents
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_LINKAGE_ROOT: dist/package-root
        run: |
          bash scripts/ci/validate-packages.sh \
            "dist/podlaz_${VERSION}_linux_amd64.deb" \
            "dist-arm64/podlaz_${VERSION}_linux_arm64.deb"

      - name: Install, reinstall, and purge package locally
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_EXPECT_VERSION: ${{ needs.resolve.outputs.version }}
          PODLAZ_EXPECT_COMMIT: ${{ steps.release-commit.outputs.commit_sha }}
          PODLAZ_EXPECT_BUILT: ${{ steps.release-commit.outputs.built_date }}
        run: |
          PODLAZ_VALIDATE_SERVICE=1 \
            bash scripts/ci/validate-package-install.sh "dist/podlaz_${VERSION}_linux_amd64.deb"

      - name: Create release artifacts
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/ci/create-release-artifacts.sh

      - name: Upload release artifacts for review
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: |
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.deb
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest-and-publish:
    name: Attest and publish GitHub Release
    needs:
      - resolve
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: podlaz-release-artifacts-${{ needs.resolve.outputs.version }}
          path: dist/release

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.tar.gz
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_amd64.deb
            dist/release/podlaz_${{ needs.resolve.outputs.version }}_linux_arm64.deb
            dist/release/SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          BUILT_DATE: ${{ needs.build.outputs.built_date }}
        run: |
          set -euo pipefail
          printf -v notes 'podlaz %s\n\nTag: %s\nCommit: %s\nBuilt: %s' "${VERSION}" "${TAG}" "${COMMIT_SHA}" "${BUILT_DATE}"
          expected_assets=(
            "podlaz_${VERSION}_linux_amd64.tar.gz"
            "podlaz_${VERSION}_linux_arm64.tar.gz"
            "podlaz_${VERSION}_linux_amd64.deb"
            "podlaz_${VERSION}_linux_arm64.deb"
            "SHA256SUMS"
          )
          release_asset_paths=()
          for asset in "${expected_assets[@]}"; do
            release_asset_paths+=("dist/release/${asset}")
          done

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              "${release_asset_paths[@]}" \
              --verify-tag \
              --title "${TAG}" \
              --notes "${notes}"
            exit 0
          fi

          mapfile -t existing_assets < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
          matching_expected_asset_count=0
          for expected_asset in "${expected_assets[@]}"; do
            for existing_asset in "${existing_assets[@]}"; do
              if [ "${existing_asset}" = "${expected_asset}" ]; then
                matching_expected_asset_count=$((matching_expected_asset_count + 1))
                break
              fi
            done
          done

          if [ "${matching_expected_asset_count}" -eq 0 ]; then
            gh release edit "${TAG}" --title "${TAG}" --notes "${notes}"
            gh release upload "${TAG}" "${release_asset_paths[@]}"
            exit 0
          fi

          if [ "${matching_expected_asset_count}" -ne "${#expected_assets[@]}" ]; then
            echo "release ${TAG} already has a partial set of expected immutable assets" >&2
            echo "remove the incomplete release assets manually or publish a new tag" >&2
            exit 1
          fi

          download_dir="$(mktemp -d)"
          trap 'rm -rf "${download_dir}"' EXIT
          for expected_asset in "${expected_assets[@]}"; do
            gh release download "${TAG}" --pattern "${expected_asset}" --dir "${download_dir}"
          done
          (
            cd "${download_dir}"
            sha256sum -c SHA256SUMS
          )
          if cmp -s "dist/release/SHA256SUMS" "${download_dir}/SHA256SUMS"; then
            gh release edit "${TAG}" --title "${TAG}" --notes "${notes}"
            echo "release ${TAG} already has matching immutable assets"
            exit 0
          fi

          echo "release ${TAG} already has expected assets, but SHA256SUMS differs" >&2
          echo "release assets are immutable; publish a new tag instead of replacing them" >&2
          exit 1
