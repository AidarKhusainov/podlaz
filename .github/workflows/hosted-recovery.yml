name: Hosted Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-recovery-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  candidate-package:
    name: Build one exact hosted recovery candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install pinned package tool
        run: bash scripts/ci/install-go-tool.sh nfpm

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ github.sha }}
        run: bash scripts/build-deb.sh

      - name: Capture exact candidate digest
        id: digest
        run: |
          set -euo pipefail
          package=dist/podlaz_0.0.0~dev-1_linux_amd64.deb
          test -f "${package}" && test ! -L "${package}"
          test "$(dpkg-deb --field "${package}" Package)" = podlaz
          test "$(dpkg-deb --field "${package}" Architecture)" = amd64
          printf 'sha256=%s\n' "$(sha256sum "${package}" | awk '{print $1}')" >>"${GITHUB_OUTPUT}"

      - name: Upload immutable candidate package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: podlaz-recovery-candidate-${{ github.sha }}
          path: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
          if-no-files-found: error
          retention-days: 7
  daemon-recovery:
    name: Same-boot daemon recovery privacy
    needs: candidate-package
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CANDIDATE_COMMIT: ${{ github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap jq nftables systemd-container iptables

      - name: Download exact candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: podlaz-recovery-candidate-${{ github.sha }}
          path: dist

      - name: Verify candidate package handoff
        env:
          EXPECTED_SHA256: ${{ needs.candidate-package.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test -f "${DEV_DEB}" && test ! -L "${DEV_DEB}"
          printf '%s  %s\n' "${EXPECTED_SHA256}" "${DEV_DEB}" | sha256sum -c -

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedDaemonRecovery' -count=1

      - name: Run same-boot daemon recovery qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-recovery-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-recovery-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-daemon-recovery.sh "${DEV_DEB}"

      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-recovery-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-recovery-public
        run: bash scripts/e2e/hosted-daemon-recovery.sh validate-report

      - name: Remove private qualification state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-recovery-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: podlaz-hosted-daemon-recovery
          path: ${{ runner.temp }}/podlaz-hosted-recovery-public/hosted-daemon-recovery.txt
          if-no-files-found: error
          retention-days: 7

