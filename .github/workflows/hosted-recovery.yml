          path: dist

      - name: Verify candidate package handoff
        env:
          EXPECTED_SHA256: ${{ needs.candidate-package.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test -f "${DEV_DEB}" && test ! -L "${DEV_DEB}"
          printf '%s  %s\n' "${EXPECTED_SHA256}" "${DEV_DEB}" | sha256sum -c -

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedStaleObservationAndForeignStateSafety' -count=1

      - name: Run stale observation qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-stale-observation-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-stale-observation-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
