  terminal-failure-convergence:
    name: Terminal failure convergence
    needs: candidate-package
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CANDIDATE_COMMIT: ${{ github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
