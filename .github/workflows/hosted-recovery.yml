        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test -f "${DEV_DEB}" && test ! -L "${DEV_DEB}"
          printf '%s  %s\n' "${EXPECTED_SHA256}" "${DEV_DEB}" | sha256sum -c -

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedNetworkReconciliation' -count=1

      - name: Run bounded network reconciliation qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-network-reconciliation-${{ matrix.scenario }}-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-network-reconciliation-${{ matrix.scenario }}-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-network-reconciliation.sh "${{ matrix.scenario }}" "${DEV_DEB}"

      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-network-reconciliation-${{ matrix.scenario }}-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-network-reconciliation-${{ matrix.scenario }}-public
        run: bash scripts/e2e/hosted-network-reconciliation.sh validate-report "${{ matrix.scenario }}"

      - name: Remove private qualification state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-network-reconciliation-${{ matrix.scenario }}-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: podlaz-hosted-network-reconciliation-${{ matrix.scenario }}
