          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-xray-replacement-public
        run: bash scripts/e2e/hosted-xray-replacement.sh validate-report

      - name: Remove private qualification state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-xray-replacement-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: podlaz-hosted-xray-replacement
          path: ${{ runner.temp }}/podlaz-hosted-xray-replacement-public/hosted-xray-replacement.txt
          if-no-files-found: error
          retention-days: 7

  network-apply-rollback:
    name: Network apply rollback diagnostics
    needs: candidate-package
    runs-on: ubuntu-24.04
