name: Issue 246 Publish Protocol Attribution

on:
  push:
    branches:
      - agent/issue-246-tun-resource-soak

permissions:
  contents: write

concurrency:
  group: issue-246-publish-protocol-attribution
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified protocol-attribution patch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-246-tun-resource-soak
          fetch-depth: 0

      - name: Apply and verify patch
        shell: bash
        env:
          PATCH_SHA256: 01306dd074427ec58a4c56c72d417b607a16d260a238b25f8666b5bd02b52bdb
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/issue-246.patch.b64" <<'PATCH_B64'
[... ELLIPSIZATION ...]_B64
          base64 -d "${RUNNER_TEMP}/issue-246.patch.b64" >"${RUNNER_TEMP}/issue-246.patch"
          printf '%s  %s\n' "${PATCH_SHA256}" "${RUNNER_TEMP}/issue-246.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/issue-246.patch"
          git apply "${RUNNER_TEMP}/issue-246.patch"
          rm -f .github/workflows/issue-246-publish-protocol-attribution.yml
          python3 -m py_compile \
            scripts/e2e/lib/tun_soak_analysis.py \
            scripts/e2e/lib/tun_soak_metrics.py \
            scripts/e2e/lib/tun_soak_process.py \
            scripts/e2e/lib/tun_soak_status.py
          python3 -m unittest \
            scripts.e2e.tests.test_tun_resource_soak_contract \
            scripts.e2e.tests.test_tun_soak_health \
            scripts.e2e.tests.test_tun_soak_metrics \
            scripts.e2e.tests.test_tun_soak_status
          bash -n scripts/e2e/tun-resource-soak.sh
          git diff --check

      - name: Commit and push verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'podlaz issue 246 automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: attribute Xray socket growth by workload'
          git push origin HEAD:agent/issue-246-tun-resource-soak
