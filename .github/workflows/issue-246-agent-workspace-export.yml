name: Issue 246 Agent Workspace Export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    name: Export tracked PR workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Keep this temporary export tied to the exact verified harness head.
      - name: Archive tracked workspace
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf "${RUNNER_TEMP}/podlaz-issue-246-workspace.tar.gz"

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-issue-246-current-workspace
          path: ${{ runner.temp }}/podlaz-issue-246-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
