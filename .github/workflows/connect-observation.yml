name: Experimental connect observation
on:
  workflow_dispatch:
  push:
    branches: [experiment/protected-connect-diagnostics]
permissions:
  contents: read
jobs:
  focused-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: b2627e35046b8561d30787f025029bc2ddab9aa5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused assertions before privileged guest
        run: |
          set -o pipefail
          go test ./internal/daemon ./internal/network/executor -run 'TestConnectObservation|TestRollbackCompletionReleaseSummaryLoss|TestResolvedScoped' -count=1 2>&1 | tee "$RUNNER_TEMP/connect-observation-components.txt"
      - name: Component assertion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connect-observation-components
          path: ${{ runner.temp }}/connect-observation-components.txt
          if-no-files-found: error
          retention-days: 7
      - name: Focused Python harness regression and authority contract
        run: |
          python3 scripts/e2e/hosted_synthetic_active_authority_contract.py
          python3 -m unittest scripts.e2e.tests.test_connect_observation_verdict -v
      - name: Executable failure-step and teardown regression
        run: bash scripts/e2e/tests/connect-observation-failure-steps.sh
      - name: Full source and concurrency qualification
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\\n%s\\n' "$unformatted"
            while IFS= read -r file; do gofmt -d "$file"; done <<<"$unformatted"
            exit 1
          fi
          go test ./...
          go vet ./...
          bash scripts/ci/repository-structure.sh --final
          go test -race ./internal/daemon ./internal/network/executor
          bash scripts/ci/install-go-tool.sh govulncheck
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap jq nftables systemd-container iptables shellcheck
          bash scripts/ci/install-go-tool.sh nfpm
          bash scripts/ci/install-go-tool.sh actionlint
      - name: Repository workflow and shell contracts
        run: bash scripts/ci/workflow-lint.sh
      - name: Build exact reference and candidate
        env:
          PODLAZ_COMMIT: ${{ github.sha }}
        run: |
          bash scripts/build-deb.sh
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/reference-source" "$BASE_SHA"
          (cd "$RUNNER_TEMP/reference-source" && PODLAZ_COMMIT="$BASE_SHA" PODLAZ_DIST_DIR="$RUNNER_TEMP/reference-dist" bash scripts/build-deb.sh)
          sha256sum dist/*.deb "$RUNNER_TEMP/reference-dist/"*.deb >"$RUNNER_TEMP/package-digests.txt"
      - name: Reference installed-package guest, observation absent
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/observation-reference-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/observation-reference-public
          PODLAZ_E2E_CANDIDATE_COMMIT: b2627e35046b8561d30787f025029bc2ddab9aa5
          PODLAZ_E2E_OBSERVATION_ENABLED: "false"
        run: bash scripts/e2e/hosted-connect-observation.sh "$RUNNER_TEMP/reference-dist/podlaz_0.0.0~dev-1_linux_amd64.deb"
      - name: Candidate installed-package guest, observer disabled control
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/observation-candidate-off-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/observation-candidate-off-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ github.sha }}
          PODLAZ_E2E_OBSERVATION_ENABLED: "false"
        run: bash scripts/e2e/hosted-connect-observation.sh dist/podlaz_0.0.0~dev-1_linux_amd64.deb
      - name: Experimental installed-package guest, independent failures
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/observation-candidate-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/observation-candidate-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ github.sha }}
          PODLAZ_E2E_OBSERVATION_ENABLED: "true"
        run: bash scripts/e2e/hosted-connect-observation.sh dist/podlaz_0.0.0~dev-1_linux_amd64.deb
      - name: Compare candidate observer on and off under equivalent guest setup
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, statistics
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          def measurements(folder, enabled, scenario, minimum):
              rows=[json.loads(line) for line in (root/folder/'connect-observation.jsonl').read_text().splitlines()]
              durations=[r['elapsed_us'] for r in rows if r.get('scenario')==scenario and r.get('enabled')==enabled]
              if len(durations)<minimum or any(type(x) is not int or x<=0 for x in durations):
                  raise SystemExit(f'incomplete candidate {enabled} {scenario} comparison')
              return durations
          report={'candidate_sha':os.environ['CANDIDATE_SHA'],
                  'comparability':'same-candidate-separate-disposable-guests-command-wrappers-present',
                  'release_reference':'separate-control-not-in-on-off-comparison'}
          for scenario,minimum in [('successful-transition',6),('b-timeout',1),('lost-ack',1)]:
              off=measurements('observation-candidate-off-public','false',scenario,minimum)
              on=measurements('observation-candidate-public','true',scenario,minimum)
              off_median=statistics.median(off)
              on_median=statistics.median(on)
              report[scenario]={'off_samples':len(off),'on_samples':len(on),
                                'off_median_us':off_median,'on_median_us':on_median,
                                'median_ratio':round(on_median/off_median,4)}
          (root/'observation-comparison.json').write_text(json.dumps(report,sort_keys=True)+'\n')
          PY
      - name: Remove private guest material
        if: always()
        run: sudo -n rm -rf "$RUNNER_TEMP/observation-reference-private" "$RUNNER_TEMP/observation-candidate-private" "$RUNNER_TEMP/observation-candidate-off-private"
      - name: Public evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connect-observation-qualification
          path: |
            ${{ runner.temp }}/observation-reference-public/
            ${{ runner.temp }}/observation-candidate-public/
            ${{ runner.temp }}/observation-candidate-off-public/
            ${{ runner.temp }}/package-digests.txt
            ${{ runner.temp }}/observation-comparison.json
          if-no-files-found: error
          retention-days: 7
