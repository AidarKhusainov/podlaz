name: Agent recovery epoch fix

on:
  push:
    branches:
      - agent/all-open-issues

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/all-open-issues
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env
      - name: Apply recovery epoch contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/daemon/network_session_state.go",
              '''\tSessionID     string                     `json:"session_id"`\n\tIntent        networkSessionIntent       `json:"intent"`''',
              '''\tSessionID     string                     `json:"session_id"`\n\tRecoveryEpoch uint64                     `json:"recovery_epoch,omitempty"`\n\tIntent        networkSessionIntent       `json:"intent"`''',
          )

          replace_once(
              "internal/daemon/network_session_state.go",
              '''func (s networkSessionStateStore) SetIntent(intent networkSessionIntent) error {''',
              '''func (s networkSessionStateStore) BeginRecoveryAttempt() (networkSessionState, bool, error) {\n\tlock := s.mutationLock()\n\tlock.Lock()\n\tdefer lock.Unlock()\n\n\tstate, exists, err := s.loadLocked()\n\tif err != nil || !exists {\n\t\treturn state, exists, err\n\t}\n\tstate = cloneNetworkSessionState(state)\n\tif state.RecoveryEpoch == ^uint64(0) {\n\t\treturn state, true, errors.New("network session recovery epoch exhausted")\n\t}\n\tstate.RecoveryEpoch++\n\tif err := s.save(state); err != nil {\n\t\treturn cloneNetworkSessionState(state), true, fmt.Errorf("persist network session recovery epoch: %w", err)\n\t}\n\treturn cloneNetworkSessionState(state), true, nil\n}\n\nfunc (s networkSessionStateStore) SetIntent(intent networkSessionIntent) error {''',
          )

          replace_once(
              "internal/daemon/network_session_resume_diagnostic.go",
              '''\tBootID             string `json:"boot_id"`\n\tResumeStage        string `json:"resume_stage"`''',
              '''\tBootID             string `json:"boot_id"`\n\tRecoveryEpoch      uint64 `json:"recovery_epoch"`\n\tResumeStage        string `json:"resume_stage"`''',
          )

          replace_once(
              "internal/daemon/network_session_resume_diagnostic.go",
              '''func persistNetworkSessionResumeFailure(continuation networkSessionContinuationStore, err error) error {\n\trecord, ok := networkSessionResumeFailure(err)\n\tif !ok {\n\t\treturn err\n\t}\n\tstore := newNetworkSessionResumeDiagnosticStore(continuation.runtimeDir, continuation.readBootID)''',
              '''func persistNetworkSessionResumeFailure(continuation networkSessionContinuationStore, recoveryEpoch uint64, err error) error {\n\trecord, ok := networkSessionResumeFailure(err)\n\tif !ok {\n\t\treturn err\n\t}\n\trecord.RecoveryEpoch = recoveryEpoch\n\tstore := newNetworkSessionResumeDiagnosticStore(continuation.runtimeDir, continuation.readBootID)''',
          )

          replace_once(
              "internal/daemon/network_session_lifecycle.go",
              '''func resumeNetworkSession(\n\tctx context.Context,\n\tcontinuation networkSessionContinuationStore,\n\tlifecycle lifecycleService,\n\tstatus networkSessionStatusFunc,\n\trecover networkSessionRecoveryFunc,\n) (bool, error) {\n\tfail := func(stage, outcome string, legacyMigration, transactionPresent bool, err error) (bool, error) {\n\t\twrapped := newNetworkSessionResumeOutcomeError(stage, outcome, legacyMigration, transactionPresent, err)\n\t\treturn false, persistNetworkSessionResumeFailure(continuation, wrapped)\n\t}''',
              '''func resumeNetworkSession(\n\tctx context.Context,\n\tcontinuation networkSessionContinuationStore,\n\tlifecycle lifecycleService,\n\tstatus networkSessionStatusFunc,\n\trecover networkSessionRecoveryFunc,\n) (bool, error) {\n\trecoveryEpoch := uint64(0)\n\tfail := func(stage, outcome string, legacyMigration, transactionPresent bool, err error) (bool, error) {\n\t\twrapped := newNetworkSessionResumeOutcomeError(stage, outcome, legacyMigration, transactionPresent, err)\n\t\treturn false, persistNetworkSessionResumeFailure(continuation, recoveryEpoch, wrapped)\n\t}''',
          )

          replace_once(
              "internal/daemon/network_session_lifecycle.go",
              '''\treconcilePrivacy := continuation.reconcilePrivacy\n\tif reconcilePrivacy == nil {''',
              '''\tif exists {\n\t\tattemptState, attemptExists, beginErr := stateStore.BeginRecoveryAttempt()\n\t\tif attemptExists {\n\t\t\trecoveryEpoch = attemptState.RecoveryEpoch\n\t\t\tstate = attemptState\n\t\t}\n\t\tif beginErr != nil {\n\t\t\treturn fail(api.NetworkSessionResumeStageStateLoad, api.NetworkSessionResumeOutcomeFailed, legacyMigration, false, fmt.Errorf("begin Network Session recovery epoch: %w", beginErr))\n\t\t}\n\t\tif !attemptExists {\n\t\t\treturn fail(api.NetworkSessionResumeStageStateLoad, api.NetworkSessionResumeOutcomeFailed, legacyMigration, false, errors.New("Network Session authority disappeared before recovery attempt"))\n\t\t}\n\t}\n\n\treconcilePrivacy := continuation.reconcilePrivacy\n\tif reconcilePrivacy == nil {''',
          )

          replace_once(
              "internal/daemon/network_session_recovery_plan.go",
              '''type networkSessionAuthoritySnapshot struct {\n\tintent            networkSessionIntent\n\tprotectionPresent bool\n\tlegacyMigration   bool\n}''',
              '''type networkSessionAuthoritySnapshot struct {\n\tintent            networkSessionIntent\n\tprotectionPresent bool\n\tlegacyMigration   bool\n\trecoveryEpoch     uint64\n}''',
          )

          replace_once(
              "internal/daemon/network_session_recovery_plan.go",
              '''\t} else if diagnosticExists {\n\t\tplan.ResumeStage = diagnostic.ResumeStage''',
              '''\t} else if diagnosticExists && diagnostic.RecoveryEpoch == authority.recoveryEpoch {\n\t\tplan.ResumeStage = diagnostic.ResumeStage''',
          )

          replace_once(
              "internal/daemon/network_session_recovery_plan.go",
              '''\t\treturn networkSessionAuthoritySnapshot{\n\t\t\tintent:            state.Intent,\n\t\t\tprotectionPresent: state.Protection != nil,\n\t\t}, true, nil''',
              '''\t\treturn networkSessionAuthoritySnapshot{\n\t\t\tintent:            state.Intent,\n\t\t\tprotectionPresent: state.Protection != nil,\n\t\t\trecoveryEpoch:     state.RecoveryEpoch,\n\t\t}, true, nil''',
          )

          replace_once(
              "docs/cli.md",
              '''`recover` is read-only. `recover --execute --yes` sends cleanup intent to the\ndaemon. The CLI must not perform privileged host cleanup directly. Ambiguous\nresources are skipped. Non-interactive execution requires `--yes`. For the\nvalidated podlaz-owned `podlaz0` target, only an exact `resolvectl` exit code `1`''',
              '''`recover` is a read-only inspection of the same recovery model used by\nexecution. When daemon startup evidence is available, dry-run projects the\ncurrent startup scan plus the bounded `network_session` recovery state; otherwise\nit falls back to conservative local inspection and does not invent daemon\nauthority. `recover --execute --yes` sends cleanup intent to the daemon and then\nruns the same Network Session follow-up lifecycle when startup recovery remains\nblocked. The CLI must not perform privileged host cleanup directly. Ambiguous or\nunowned resources are skipped, and non-interactive execution requires `--yes`.\n\nThe stable `network_session` projection contains only semantic recovery evidence:\n`authority`, `intent`, `startup_gate`, optional `resume_stage`,\n`last_resume_outcome`, optional `last_tun_failure_phase`, optional\n`rollback_status`, `transaction_present`, `legacy_migration`,\n`cleanup_authority`, and `next_action`. It deliberately excludes profile/server\nidentity, Network Session and transaction identifiers, generated config, and raw\nchild output. `resume_stage` can identify state load, legacy migration, Privacy\nEnvelope reconciliation, exact transaction recovery, generic recovery, connect\nreplay, or terminal teardown. `last_resume_outcome` is one of `not-attempted`,\n`failed`, `incomplete`, or `succeeded`; `next_action` is `retry-resume`,\n`continue-teardown`, `manual-diagnosis`, or `none`.\n\nExecution is complete only when ordinary cleanup has no failed/incomplete result\nand Network Session recovery has an open startup gate with `next_action: none`.\nA blocked gate or any remaining next action is incomplete and makes execute return\nexit code `1`; cleanup failure also returns `1`. JSON execute output reports\n`status: warn` for incomplete convergence and `status: fail` for cleanup failure.\nDry-run JSON reports `status: warn` when cleanup candidates, Network Session\nauthority requiring convergence, or incomplete inspection are present.\n\nFor the validated podlaz-owned `podlaz0` target, only an exact `resolvectl` exit code `1`''',
          )
          PY
          gofmt -w \
            internal/daemon/network_session_state.go \
            internal/daemon/network_session_resume_diagnostic.go \
            internal/daemon/network_session_lifecycle.go \
            internal/daemon/network_session_recovery_plan.go
          git diff --check
      - name: Verify focused recovery contract
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/daemon -run 'TestResumeNetworkSession(ReportsStableFailureStages|CanRetryAfterReplayFailure|SuccessfulRetryIgnoresStaleFailureDiagnostic)$' -count=1
          go test ./internal/daemon -count=1
      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...
          bash scripts/acceptance/tests/run.sh
          bash scripts/ci/repository-structure.sh --final
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-recovery-epoch-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/daemon/network_session_state.go \
                  internal/daemon/network_session_resume_diagnostic.go \
                  internal/daemon/network_session_lifecycle.go \
                  internal/daemon/network_session_recovery_plan.go \
                  docs/cli.md \
                  .github/workflows/agent-recovery-epoch-fix.yml
          git commit -m 'fix: invalidate stale recovery diagnostics'
          git push origin HEAD:agent/all-open-issues
