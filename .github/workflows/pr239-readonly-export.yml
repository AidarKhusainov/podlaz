name: Publish PR 239 lifecycle review fixes

on:
  push:
    branches:
      - agent/issue-238-tun-l3-addressing
    paths:
      - .pr239-publish/trigger

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified lifecycle patch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply and publish verified patch
        shell: bash
        env:
          EXPECTED_PATCH_SHA256: 740335354cb858d0b1a9ac4d817962bae7477f39c1011f3d5a7e3bc3bf240b82
          EXPECTED_TREE_SHA: 970b3494344a7474c78af7b8517418043065b8db
        run: |
          set -euo pipefail
          cat .pr239-publish/patch.part.* | base64 --decode | gzip -d >"${RUNNER_TEMP}/pr239-lifecycle-review.patch"
          printf '%s  %s\n' "${EXPECTED_PATCH_SHA256}" "${RUNNER_TEMP}/pr239-lifecycle-review.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/pr239-lifecycle-review.patch"
          git apply "${RUNNER_TEMP}/pr239-lifecycle-review.patch"
          rm -rf .pr239-publish
          rm -f .github/workflows/pr239-readonly-export.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close committed recovery and preflight gaps'
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE_SHA}"
          git push origin HEAD:agent/issue-238-tun-l3-addressing
