name: Hosted VM Boot Authority

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [diagnostics/boot-replay-bounded-cycles]
  workflow_dispatch:
    inputs:
      restart_cycles:
        description: 'Same-boot restart cycles in one guest; stop on first failure'
        type: choice
        default: '1'
        options: ['1', '2', '3']

permissions:
  contents: read

concurrency:
  group: hosted-vm-boot-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Real boot autostart and same-boot authority
    runs-on: ubuntu-24.04
    # Multi-cycle diagnostics have a hard spend ceiling, not a relaxed
    # acceptance deadline. A cancelled/timed-out experiment is inconclusive.
    timeout-minutes: 30
    env:
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
      CANDIDATE_COMMIT: ${{ github.sha }}
      PODLAZ_E2E_BOOT_RESTART_CYCLES: ${{ github.event_name == 'push' && '3' || inputs.restart_cycles || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate diagnostic budget
        run: |
          case "${PODLAZ_E2E_BOOT_RESTART_CYCLES}" in
            1|2|3) ;;
            *) echo 'restart_cycles must be 1, 2 or 3' >&2; exit 1 ;;
          esac
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env
      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedVMBootAuthority' -count=1
      - name: Install VM qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cloud-image-utils iptables jq nftables openssh-client qemu-system-x86 qemu-utils
          bash scripts/ci/install-go-tool.sh nfpm
      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: bash scripts/build-deb.sh
      - name: Run real boot authority qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-vm-boot-authority-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-vm-boot-authority-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-vm-boot-authority.sh "${DEV_DEB}"
      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-vm-boot-authority-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-vm-boot-authority-public
        run: bash scripts/e2e/hosted-vm-boot-authority.sh validate-report
      - name: Remove private VM state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-vm-boot-authority-private
        run: rm -rf "${E2E_TMP_ROOT}"
      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: podlaz-hosted-vm-boot-authority
          path: ${{ runner.temp }}/podlaz-hosted-vm-boot-authority-public/hosted-vm-boot-authority.txt
          if-no-files-found: error
          retention-days: 7
