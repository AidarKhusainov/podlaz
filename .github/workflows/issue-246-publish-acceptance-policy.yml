name: Issue 246 Publish Acceptance Policy

on:
  push:
    branches:
      - agent/issue-246-tun-resource-soak

permissions:
  contents: write

concurrency:
  group: issue-246-publish-acceptance-policy
  cancel-in-progress: true

jobs:
  publish:
    name: Apply and verify calibrated acceptance policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-246-tun-resource-soak
          fetch-depth: 0
          persist-credentials: true

      - name: Apply acceptance-policy patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/issue-246-acceptance-policy.patch
          git apply .github/issue-246-acceptance-policy.patch
          rm -f -- .github/issue-246-acceptance-policy.patch

      - name: Verify deterministic resource-soak contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/e2e/lib/tun_soak_*.py scripts/e2e/tests/test_tun_soak_*.py
          python3 -m unittest \
            scripts.e2e.tests.test_tun_resource_soak_contract \
            scripts.e2e.tests.test_tun_soak_metrics \
            scripts.e2e.tests.test_tun_soak_status \
            scripts.e2e.tests.test_tun_soak_health \
            scripts.e2e.tests.test_tun_soak_cleanup
          bash -n scripts/e2e/lib/tun_soak_health.sh scripts/e2e/lib/tun_soak_cleanup.sh scripts/e2e/tun-resource-soak.sh
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'podlaz issue 246 automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/development.md \
            docs/e2e.md \
            scripts/e2e/tun-resource-soak-policy.json \
            scripts/e2e/tests/test_tun_resource_soak_contract.py \
            .github/issue-246-acceptance-policy.patch
          git commit -m 'test: calibrate TUN resource acceptance envelope'
          git push origin HEAD:agent/issue-246-tun-resource-soak
