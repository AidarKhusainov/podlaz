name: Ephemeral Remnawave

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-remnawave.yml'
      - 'scripts/e2e/remnawave-fixture.sh'
      - 'scripts/e2e/remnawave-subscription-acceptance.sh'
      - 'scripts/e2e/remnawave-proxy-acceptance.sh'
      - 'scripts/e2e/hosted-remnawave-tun.sh'
      - 'scripts/e2e/hosted-synthetic-tun.sh'
      - 'scripts/e2e/lib/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephemeral-remnawave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feasibility:
    name: Hosted fixture feasibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove ephemeral Remnawave fixture
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-remnawave-private
        run: |
          rm -rf "${E2E_TMP_ROOT}"
          install -d -m 0700 "${E2E_TMP_ROOT}"
          bash scripts/e2e/remnawave-fixture.sh

      - name: Remove feasibility private state
        if: always()
        run: sudo -n rm -rf "${RUNNER_TEMP}/podlaz-remnawave-private"

  subscription-hwid:
    name: Live subscription and HWID lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          bash scripts/ci/install-go-tool.sh nfpm
          bash scripts/build-deb.sh
          test -f "${DEV_DEB}"

      - name: Prove Podlaz subscription and HWID lifecycle
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-remnawave-client-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-client-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/remnawave-subscription-acceptance.sh "${DEV_DEB}"

      - name: Validate subscription public evidence
        id: evidence_scan
        if: always()
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-client-public
        run: bash scripts/e2e/scan-remnawave-artifacts.sh subscription

      - name: Remove subscription private state
        id: private_cleanup
        if: always()
        run: sudo -n rm -rf "${RUNNER_TEMP}/podlaz-remnawave-client-private"

      - name: Upload subscription and HWID evidence
        if: ${{ always() && steps.evidence_scan.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-remnawave-subscription-pr
          path: ${{ runner.temp }}/podlaz-remnawave-client-public/remnawave-subscription.txt
          if-no-files-found: error
          retention-days: 7

  proxy:
    name: Ephemeral Remnawave proxy data plane
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          bash scripts/ci/install-go-tool.sh nfpm
          bash scripts/build-deb.sh
          test -f "${DEV_DEB}"

      - name: Prove proxy data plane through ephemeral Remnawave
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-remnawave-proxy-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-proxy-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          PODLAZ_E2E_RELIABILITY_CYCLES: '3'
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/remnawave-proxy-acceptance.sh "${DEV_DEB}"

      - name: Validate proxy public evidence
        id: evidence_scan
        if: always()
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-proxy-public
        run: bash scripts/e2e/scan-remnawave-artifacts.sh proxy

      - name: Remove proxy private state
        id: private_cleanup
        if: always()
        run: sudo -n rm -rf "${RUNNER_TEMP}/podlaz-remnawave-proxy-private"

      - name: Upload proxy evidence
        if: ${{ always() && steps.evidence_scan.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-remnawave-proxy-pr
          path: ${{ runner.temp }}/podlaz-remnawave-proxy-public/remnawave-proxy.txt
          if-no-files-found: error
          retention-days: 7

  full-tun:
    name: Isolated ephemeral Remnawave full-TUN
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install isolated TUN qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap jq nftables systemd-container iptables
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          bash scripts/build-deb.sh
          test -f "${DEV_DEB}"

      - name: Capture candidate digest
        id: candidate
        run: printf 'sha256=%s\n' "$(sha256sum "${DEV_DEB}" | awk '{print $1}')" >>"${GITHUB_OUTPUT}"

      - name: Run isolated Remnawave full-TUN qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-remnawave-tun-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-tun-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-remnawave-tun.sh "${DEV_DEB}"

      - name: Validate TUN public verdict
        id: evidence_scan
        if: always()
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-tun-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          PODLAZ_E2E_CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: bash scripts/e2e/hosted-remnawave-tun.sh validate-report

      - name: Remove TUN private state
        id: private_cleanup
        if: always()
        run: sudo -n rm -rf "${RUNNER_TEMP}/podlaz-remnawave-tun-private"

      - name: Upload TUN evidence
        if: ${{ always() && steps.evidence_scan.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-remnawave-tun-pr
          path: ${{ runner.temp }}/podlaz-remnawave-tun-public/hosted-remnawave-tun.txt
          if-no-files-found: error
          retention-days: 7
