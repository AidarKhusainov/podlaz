name: Ephemeral Remnawave

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-remnawave.yml'
      - 'scripts/e2e/remnawave-fixture.sh'
      - 'scripts/e2e/remnawave-subscription-acceptance.sh'
      - 'scripts/e2e/remnawave-proxy-acceptance.sh'
      - 'scripts/e2e/lib/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephemeral-remnawave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feasibility:
    name: Hosted fixture feasibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove ephemeral Remnawave fixture
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-remnawave-private
        run: |
          rm -rf "${E2E_TMP_ROOT}"
          install -d -m 0700 "${E2E_TMP_ROOT}"
          bash scripts/e2e/remnawave-fixture.sh

  subscription-hwid:
    name: Live subscription and HWID lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          bash scripts/ci/install-go-tool.sh nfpm
          bash scripts/build-deb.sh
          test -f "${DEV_DEB}"

      - name: Prove Podlaz subscription and HWID lifecycle
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-remnawave-client-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-client-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/remnawave-subscription-acceptance.sh "${DEV_DEB}"

  proxy:
    name: Ephemeral Remnawave proxy data plane
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          bash scripts/ci/install-go-tool.sh nfpm
          bash scripts/build-deb.sh
          test -f "${DEV_DEB}"

      - name: Prove proxy data plane through ephemeral Remnawave
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-remnawave-proxy-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-remnawave-proxy-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          PODLAZ_E2E_RELIABILITY_CYCLES: '3'
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/remnawave-proxy-acceptance.sh "${DEV_DEB}"
