name: Xray Transport Version Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-comparison:
    name: Isolated VMess/Trojan response comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download, verify and compare official Xray binaries
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "${RUNNER_TEMP}/xray-version-comparison"
          for version in v26.3.27 v26.9.9; do
            root="${RUNNER_TEMP}/xray-version-comparison/${version}"
            install -d -m 0700 "${root}"
            base="https://github.com/XTLS/Xray-core/releases/download/${version}"
            curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --retry 2 \
              --output "${root}/xray.zip.dgst" "${base}/Xray-linux-64.zip.dgst"
            curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --retry 2 \
              --output "${root}/xray.zip" "${base}/Xray-linux-64.zip"
            expected="$(sed -n -E 's/^SHA2-256=[[:space:]]*([0-9a-fA-F]{64})[[:space:]]*$/\1/p' "${root}/xray.zip.dgst" | head -n 1)"
            [[ "${expected}" =~ ^[0-9a-fA-F]{64}$ ]]
            printf '%s  %s\n' "${expected}" "${root}/xray.zip" | sha256sum --check --status
            unzip -p "${root}/xray.zip" xray >"${root}/xray"
            chmod 0700 "${root}/xray"
            printf 'version=%s verified_archive=yes\n' "${version}"
            python3 scripts/e2e/xray_typed_transport_compare.py "${root}/xray"
          done
      - name: Compare bundled Xray clients with verified independent server
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/xray-version-comparison/reference"
          install -d -m 0700 "${root}"
          curl --fail --location --proto '=https' --silent --show-error \
            "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v1.14.2" >"${root}/release.json"
          filename="sing-box-1.14.2-linux-amd64.tar.gz"
          url="$(jq -er --arg name "${filename}" '.assets[] | select(.name == $name) | .browser_download_url' "${root}/release.json")"
          digest="$(jq -er --arg name "${filename}" '.assets[] | select(.name == $name) | .digest' "${root}/release.json")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          curl --fail --location --proto '=https' --silent --show-error \
            --output "${root}/reference.tar.gz" "${url}"
          printf '%s  %s\n' "${digest#sha256:}" "${root}/reference.tar.gz" | sha256sum --check --status
          tar -xzf "${root}/reference.tar.gz" -C "${root}"
          binary="$(find "${root}" -type f -name sing-box -print -quit)"
          [[ -n "${binary}" && -f "${binary}" ]]
          chmod 0700 "${binary}"
          printf 'reference_server=verified_independent_server_disposable_only\n'
          for version in v26.3.27 v26.9.9; do
            printf 'xray_client_version=%s\n' "${version}"
            python3 scripts/e2e/xray_typed_transport_compare.py \
              "${RUNNER_TEMP}/xray-version-comparison/${version}/xray" "${binary}"
          done
      - name: Delete private diagnostic state
        if: always()
        run: sudo -n rm -rf "${RUNNER_TEMP}/xray-version-comparison"
