name: TUN Package Convergence E2E Issue 238

on:
  push:
    branches:
      - agent/issue-238-tun-l3-addressing
    paths:
      - .github/workflows/e2e-tun-package-convergence-issue238.yml

permissions:
  contents: write

concurrency:
  group: podlaz-tun-package-convergence-issue238-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  package-convergence:
    name: Installed package TUN convergence
    runs-on: [self-hosted, linux, x64, vpn-e2e, ubuntu-24.04]
    environment: vpn-e2e
    timeout-minutes: 150
    env:
      PODLAZ_E2E_PROFILE_URI: ${{ secrets.PODLAZ_E2E_PROFILE_URI }}
      PODLAZ_E2E_PROFILE_URI_LIST: ${{ secrets.PODLAZ_E2E_PROFILE_URI_LIST }}
      PODLAZ_E2E_PUBLIC_IP_CHECK_URL: ${{ vars.PODLAZ_E2E_PUBLIC_IP_CHECK_URL }}
      PODLAZ_E2E_DNS_CHECK_HOST: ${{ vars.PODLAZ_E2E_DNS_CHECK_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Run installed-package convergence scenario
        id: convergence
        timeout-minutes: 115
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          bash scripts/e2e/tun-package-convergence.sh

      - name: Recover and verify clean host state
        id: cleanup
        if: always()
        timeout-minutes: 20
        shell: bash
        run: |
          PODLAZ_E2E_PURGE_PACKAGE=true \
            timeout --signal=TERM --kill-after=30s 900s \
            bash scripts/e2e/tun-package-cleanup.sh

      - name: Scan evidence before upload
        id: evidence_scan
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/podlaz-e2e-artifacts"
          mkdir -p "${artifact_dir}"
          mapfile -t host_needles < <(
            {
              hostname -f 2>/dev/null || true
              ip -o -4 addr show scope global 2>/dev/null | awk '{split($4, value, "/"); print value[1]; print $2}'
              ip -o -6 addr show scope global 2>/dev/null | awk '{split($4, value, "/"); print value[1]; print $2}'
              ip -4 route show default 2>/dev/null | awk '{for (i=1; i<=NF; i++) {if ($i=="via" || $i=="dev") print $(i+1)}}'
              resolvectl status --no-pager 2>/dev/null | awk -F: '/Current DNS Server|DNS Servers|DNS Domain/ {gsub(/^[[:space:]]+/, "", $2); for (i=1; i<=split($2, values, /[[:space:]]+/); i++) print values[i]}'
              curl -4 -fsS --max-time 30 "${PODLAZ_E2E_PUBLIC_IP_CHECK_URL}" 2>/dev/null || true
            } | sed '/^[[:space:]]*$/d' | sort -u
          )
          python3 scripts/e2e/lib/redaction_scan.py \
            sensitive-values \
            "${artifact_dir}" \
            "${artifact_dir}/pre-upload-redaction-scan.txt" \
            "${PODLAZ_E2E_PROFILE_URI}" \
            "${PODLAZ_E2E_PROFILE_URI_LIST}" \
            "${host_needles[@]}"

      - name: Upload package convergence evidence
        id: evidence_upload
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.evidence_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-tun-package-convergence-e2e-evidence-issue238
          path: ${{ runner.temp }}/podlaz-e2e-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Publish sanitized result marker
        if: always()
        shell: bash
        env:
          CONVERGENCE_OUTCOME: ${{ steps.convergence.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          EVIDENCE_SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "convergence=${CONVERGENCE_OUTCOME}" \
            "cleanup=${CLEANUP_OUTCOME}" \
            "evidence_scan=${EVIDENCE_SCAN_OUTCOME}" \
            "evidence_upload=${EVIDENCE_UPLOAD_OUTCOME}" \
            > .e2e-result-issue238
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .e2e-result-issue238
          git commit -m 'ci: record issue 238 package convergence result'
          git push origin HEAD:agent/issue-238-tun-l3-addressing
