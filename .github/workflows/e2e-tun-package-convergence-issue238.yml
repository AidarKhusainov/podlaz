name: PR 239 workspace export

on:
  push:
    branches:
      - agent/issue-238-tun-l3-addressing
    paths:
      - .github/workflows/e2e-tun-package-convergence-issue238.yml

permissions:
  contents: read

jobs:
  export:
    name: Export exact PR workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output="${RUNNER_TEMP}/podlaz-pr239-workspace.tar.gz" \
            HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-pr239-workspace
          path: ${{ runner.temp }}/podlaz-pr239-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
