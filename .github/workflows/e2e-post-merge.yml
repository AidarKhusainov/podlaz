name: E2E post-merge dispatch

on:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: read

concurrency:
  group: podlaz-e2e-post-merge-dispatch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch E2E workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger existing manual E2E workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh workflow run e2e.yml --ref "${GITHUB_REF_NAME}"; then
            echo "::warning::Failed to dispatch E2E workflow for ${GITHUB_REF_NAME}"
          fi
