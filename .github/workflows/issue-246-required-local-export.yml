name: Issue 246 Publish Required Local Fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-required-local-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    name: Publish verified required-local fix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply, verify, and publish fix
        shell: bash
        run: |
          set -euo pipefail
          chunk='.agent-sync/issue246/required-local-fix.b64'
          [[ -f "${chunk}" ]] || {
            echo 'No staged required-local patch remains.'
            exit 0
          }

          base64 -d "${chunk}" > "${RUNNER_TEMP}/required-local.patch.xz"
          printf '%s  %s\n' \
            '59edfb353a62667d71c5472e432109e85f9b516fa63c573d11ecb3b31ece41de' \
            "${RUNNER_TEMP}/required-local.patch.xz" | sha256sum -c -
          xz -dc "${RUNNER_TEMP}/required-local.patch.xz" > "${RUNNER_TEMP}/required-local.patch"
          printf '%s  %s\n' \
            'a985c99234e2381dbeb19e245cacaae2737e383002c389138a4cc4e006f33a60' \
            "${RUNNER_TEMP}/required-local.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/required-local.patch"
          git apply "${RUNNER_TEMP}/required-local.patch"

          python3 -m py_compile scripts/e2e/lib/tun_soak_*.py scripts/e2e/tests/test_tun_soak_*.py
          python3 -m unittest \
            scripts.e2e.tests.test_tun_resource_soak_contract \
            scripts.e2e.tests.test_tun_soak_cleanup \
            scripts.e2e.tests.test_tun_soak_health \
            scripts.e2e.tests.test_tun_soak_isolation \
            scripts.e2e.tests.test_tun_soak_metrics \
            scripts.e2e.tests.test_tun_soak_status
          bash -n \
            scripts/e2e/lib/tun_soak_health.sh \
            scripts/e2e/lib/tun_soak_cleanup.sh \
            scripts/e2e/tun-resource-soak.sh
          git diff --check

          python3 - <<'PY'
          import json
          import subprocess
          from scripts.e2e.lib import tun_soak_isolation as isolation

          def load(*args: str):
              return json.loads(subprocess.check_output(args, text=True))

          links = isolation._normalize_links(load('ip', '-j', '-d', 'link', 'show'))
          addresses = isolation._normalize_addresses(load('ip', '-j', 'addr', 'show'))
          routes_v4 = isolation._normalize_routes(
              load('ip', '-j', '-4', 'route', 'show', 'table', 'all'), 'ipv4'
          )
          routes_v6 = isolation._normalize_routes(
              load('ip', '-j', '-6', 'route', 'show', 'table', 'all'), 'ipv6'
          )
          snapshot = {
              'links': links,
              'addresses': addresses,
              'routes_v4': routes_v4,
              'routes_v6': routes_v6,
          }
          required, optional = isolation._local_route_expectations(snapshot)
          observed = {
              isolation._route_key(route)
              for route in routes_v4 + routes_v6
              if route['table'] == 'local'
          }
          if required - observed or observed - required - optional:
              raise SystemExit('real iproute2 local-route consistency smoke failed')
          PY

          find scripts/e2e -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f -- "${chunk}"
          rmdir .agent-sync/issue246 2>/dev/null || true
          rmdir .agent-sync 2>/dev/null || true
          test -z "$(git diff --name-only -- .github/workflows)"

          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'podlaz issue 246 automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: require kernel-derived local routes'
          git push origin HEAD:agent/issue-246-tun-resource-soak
