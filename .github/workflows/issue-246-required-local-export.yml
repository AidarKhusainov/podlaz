name: Issue 246 Diagnose Required Local Routes

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: issue-246-required-local-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    name: Diagnose sanitized local-route shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply patch and classify host route shapes
        shell: bash
        run: |
          set -euo pipefail
          chunk='.agent-sync/issue246/required-local-fix.b64'
          base64 -d "${chunk}" > "${RUNNER_TEMP}/required-local.patch.xz"
          printf '%s  %s\n' \
            'bf68a8d5f8890669c7c0c79ecccb96b6c4d54e14671feb1c635ff1633bf3a745' \
            "${RUNNER_TEMP}/required-local.patch.xz" | sha256sum -c -
          xz -dc "${RUNNER_TEMP}/required-local.patch.xz" > "${RUNNER_TEMP}/required-local.patch"
          git apply --check "${RUNNER_TEMP}/required-local.patch"
          git apply "${RUNNER_TEMP}/required-local.patch"

          python3 - <<'PY'
          import collections
          import json
          import subprocess
          from scripts.e2e.lib import tun_soak_isolation as isolation

          def load(*args: str):
              return json.loads(subprocess.check_output(args, text=True))

          addresses = isolation._normalize_addresses(load('ip', '-j', 'addr', 'show'))
          routes_v4 = isolation._normalize_routes(
              load('ip', '-j', '-4', 'route', 'show', 'table', 'all'), 'ipv4'
          )
          routes_v6 = isolation._normalize_routes(
              load('ip', '-j', '-6', 'route', 'show', 'table', 'all'), 'ipv6'
          )
          snapshot = {'addresses': addresses, 'routes_v4': routes_v4, 'routes_v6': routes_v6}
          required, optional = isolation._local_route_expectations(snapshot)
          observed = {
              isolation._route_key(route)
              for route in routes_v4 + routes_v6
              if route['table'] == 'local'
          }
          missing = required - observed
          unknown = observed - required - optional

          def signature(encoded: str) -> tuple[object, ...]:
              route = json.loads(encoded)
              return (
                  route.get('family'),
                  route.get('type'),
                  route.get('protocol'),
                  route.get('scope'),
                  route.get('metric'),
                  route.get('preference'),
                  tuple(route.get('flags', [])),
                  route.get('dev') == 'lo',
              )

          address_shapes = collections.Counter()
          for link in addresses:
              for address in link['addresses']:
                  address_shapes[
                      (
                          address['family'],
                          address['scope'],
                          tuple(address['flags']),
                          link['ifname'] == 'lo',
                          bool(address['extras'].get('broadcast')),
                      )
                  ] += 1
          print('address_shapes=', sorted(address_shapes.items()))
          print('required_count=', len(required), 'optional_count=', len(optional), 'observed_count=', len(observed))
          print('missing_signatures=', sorted(collections.Counter(signature(item) for item in missing).items()))
          print('unknown_signatures=', sorted(collections.Counter(signature(item) for item in unknown).items()))
          if missing or unknown:
              raise SystemExit('sanitized local-route shape mismatch')
          PY
