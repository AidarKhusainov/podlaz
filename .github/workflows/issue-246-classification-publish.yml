name: Issue 246 Classification Publish

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-classification-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact payload commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify, test, and publish classified diagnostics
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/issue-246-classification.patch.gz.b64
          if [[ ! -f "${payload}" ]]; then
            echo 'No classified diagnostic payload remains.'
            exit 0
          fi
          echo '65493993904fa3f1748b3956f01d907930ec892f405361888614b6c161c45038  .github/issue-246-classification.patch.gz.b64' | sha256sum --check --strict
          base64 --decode "${payload}" > /tmp/issue-246-classification.patch.gz
          echo '193fae5a21cea320eb99aca05463e793de48108d3100641c74a83787ecbcc49d  /tmp/issue-246-classification.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/issue-246-classification.patch.gz > /tmp/issue-246-classification.patch
          echo 'b9b4a606cf8cc584c328746c5540a16dce75bf99671dac768320c69d5bfbc581  /tmp/issue-246-classification.patch' | sha256sum --check --strict
          git apply --check /tmp/issue-246-classification.patch
          git apply --index /tmp/issue-246-classification.patch
          git rm -- "${payload}"
          bash -n scripts/e2e/tun-resource-soak.sh
          python3 - <<'PY'
          from pathlib import Path
          for root in ('scripts/e2e', 'scripts/e2e/lib', 'scripts/e2e/tests'):
              for path in Path(root).glob('*.py'):
                  compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/e2e/tests -p 'test_*.py'
          find scripts/e2e -type d -name __pycache__ -prune -exec rm -rf -- {} +
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: classify resource soak command failures safely'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
