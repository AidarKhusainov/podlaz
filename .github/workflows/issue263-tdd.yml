name: Issue 263 TDD

on:
  pull_request:
    paths:
      - 'internal/api/**'
      - '.github/workflows/issue263-tdd.yml'

permissions:
  contents: read

jobs:
  api-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Show baseline formatting drift
        run: |
          gofmt -d internal/api/status.go internal/daemon/e2e_tun_reconciliation_hooks.go || true
      - name: Test autostart API
        run: go test ./internal/api
