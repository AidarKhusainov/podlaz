name: Issue 246 Health Convergence Publish

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-health-convergence-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact payload commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify, test, and publish health convergence patch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/issue-246-health.patch.gz.b64
          if [[ ! -f "${payload}" ]]; then
            echo 'No health convergence payload remains.'
            exit 0
          fi

          echo '8183df89531b7a1cb78f4ee239ad6212a06dd54cf58a5316e16a11c898db0544  .github/issue-246-health.patch.gz.b64' | sha256sum --check --strict
          base64 --decode "${payload}" > /tmp/issue-246-health.patch.gz
          echo '2fb44240c6ad6496dee61a8bf5e1325c50865d5a3460770e9c3e2adf5aa395e3  /tmp/issue-246-health.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/issue-246-health.patch.gz > /tmp/issue-246-health.patch
          echo '6975c5ed6eeb458038ee8a50391c098e9ed31a274a4e43fbea6b1b4197a3c1c4  /tmp/issue-246-health.patch' | sha256sum --check --strict
          git merge-base --is-ancestor 89256b751a2cb52f9bf3382ad50c6dee016e388d HEAD
          git apply --check /tmp/issue-246-health.patch
          git apply --index /tmp/issue-246-health.patch
          git rm -- "${payload}"

          bash -n scripts/e2e/tun-resource-soak.sh
          bash -n scripts/e2e/lib/tun_soak_health.sh
          python3 - <<'PY'
          from pathlib import Path
          for root in ('scripts/e2e', 'scripts/e2e/lib', 'scripts/e2e/tests'):
              for path in Path(root).glob('*.py'):
                  compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/e2e/tests -p 'test_*.py'
          find scripts/e2e -type d -name __pycache__ -prune -exec rm -rf -- {} +
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: wait for verified TUN health before sampling'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
