name: Issue 246 Workspace Export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Archive tracked workspace
        shell: bash
        run: git archive --format=tar.gz --output=/tmp/podlaz-issue-246-current.tar.gz HEAD

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-issue-246-current-workspace
          path: /tmp/podlaz-issue-246-current.tar.gz
          if-no-files-found: error
          retention-days: 1
