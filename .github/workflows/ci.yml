name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          bash scripts/ci/install-go-tool.sh actionlint

      - name: Lint workflows and shell scripts
        run: |
          set -o pipefail
          bash scripts/ci/workflow-lint.sh 2>&1 | tee /tmp/podlaz-workflow-lint.txt

      - name: Repository structure contract
        run: bash scripts/ci/repository-structure-test.sh

      - name: Active repository structure
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: bash scripts/ci/repository-structure.sh

      - name: Final repository structure
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash scripts/ci/repository-structure.sh --final

      - name: Upload workflow lint diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: podlaz-workflow-lint-diagnostics
          path: /tmp/podlaz-workflow-lint.txt
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Go and CLI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Go fmt, test, and vet
        run: |
          set -o pipefail
          bash scripts/ci/go-core.sh 2>&1 | tee /tmp/podlaz-go-core.txt

      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: podlaz-go-diagnostics
          path: /tmp/podlaz-go-core.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Govulncheck
        run: |
          bash scripts/ci/install-go-tool.sh govulncheck
          govulncheck ./...

      - name: Install CLI smoke tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish

      - name: CLI smoke contract
        run: bash scripts/ci/cli-smoke.sh

      - name: CLI behavior contract
        run: bash scripts/e2e/cli-contract.sh

  vulnerable-go-rejection:
    name: Reject vulnerable local Go release candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Deliberately install vulnerable Go for a negative test ONLY.
      # No product binary or package is permitted to leave this job.
      - name: Setup vulnerable Go test fixture
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: false

      - name: Prove GOTOOLCHAIN=local cannot produce release candidates
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.9

          if bash scripts/ci/require-patched-go.sh >"${RUNNER_TEMP}/go-rejection.log" 2>&1; then
            echo 'vulnerable local compiler passed the security gate' >&2
            exit 1
          fi
          grep -F 'requires a patched Go toolchain' "${RUNNER_TEMP}/go-rejection.log"

          if bash scripts/build-deb.sh >"${RUNNER_TEMP}/deb-rejection.log" 2>&1; then
            echo 'vulnerable local compiler produced a Debian candidate' >&2
            exit 1
          fi
          grep -F 'requires a patched Go toolchain' "${RUNNER_TEMP}/deb-rejection.log"
          test ! -e dist/package-root/usr/bin/podlaz
          test ! -e dist/package-root/usr/bin/podlazd
          test ! -e dist/podlaz_0.0.0~dev-1_linux_amd64.deb

          # Independently reject a prebuilt vulnerable binary even when the
          # release archiver runs with another compiler.
          fixture="$(mktemp -d)"
          trap 'rm -rf "${fixture}"' EXIT
          printf 'package main\nfunc main() {}\n' > "${fixture}/main.go"
          GOWORK=off GO111MODULE=off go build -o "${fixture}/vulnerable" "${fixture}/main.go"
          test "$(go version -m "${fixture}/vulnerable" | awk 'NR==1 {print $2}')" = go1.26.9

          for root in dist/package-root dist-arm64/package-root; do
            install -D -m 0755 "${fixture}/vulnerable" "${root}/usr/bin/podlaz"
            install -D -m 0755 "${fixture}/vulnerable" "${root}/usr/bin/podlazd"
          done
          if VERSION=0.2.47+pr.security bash scripts/ci/create-release-artifacts.sh >"${RUNNER_TEMP}/archive-rejection.log" 2>&1; then
            echo 'release archiver accepted vulnerable binaries' >&2
            exit 1
          fi
          grep -F 'requires a patched Go toolchain' "${RUNNER_TEMP}/archive-rejection.log"
          test ! -e dist/release/podlaz_0.2.47+pr.security_linux_amd64.tar.gz
          test ! -e dist/release/podlaz_0.2.47+pr.security_linux_amd64.deb

  real-nftables:
    name: Real nftables ownership contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.mod

      - name: Install nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables

      - name: Compile privileged nftables contract
        env:
          GOFLAGS: -mod=readonly
        run: go test -c -o /tmp/podlaz-executor-real-nft.test ./internal/network/executor

      - name: Apply, verify, and remove a real Privacy Envelope
        run: |
          sudo env "PATH=${PATH}" PODLAZ_TEST_REAL_NFT=1 \
            /tmp/podlaz-executor-real-nft.test \
            -test.run '^TestPrivacyEnvelopeRealNFTRoundTrip$' \
            -test.v

  deb-package:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
      ARM64_DEB: dist-arm64/podlaz_0.0.0~dev-1_linux_arm64.deb
      CI_PODLAZ_COMMIT: ci-test
      CI_PODLAZ_BUILT: Jun 19 2026
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl dpkg file lintian man-db unzip zsh fish gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build Debian packages
        run: bash scripts/ci/build-dev-packages.sh

      - name: Upload package build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: podlaz-build-deb-diagnostics
          path: |
            /tmp/podlaz-build-deb-amd64.txt
            /tmp/podlaz-build-deb-arm64.txt
            /tmp/podlaz-built-version.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate Mihomo Hysteria2 synthetic config with bundled Xray
        env:
          GOFLAGS: -mod=readonly
        run: |
          PODLAZ_TEST_XRAY_BINARY="${PWD}/dist/package-root/usr/lib/podlaz/xray" \
            go test ./internal/sub -run '^TestMihomoHysteria2PackagedXrayAcceptsMarkedNativeConfig$' -count=1

      - name: Validate package metadata and contents
        env:
          PODLAZ_LINKAGE_ROOT: dist/package-root
        run: |
          set -o pipefail
          bash scripts/ci/validate-packages.sh "${DEV_DEB}" "${ARM64_DEB}" 2>&1 | tee /tmp/podlaz-package-validation.txt

      - name: Upload package validation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: podlaz-package-validation-diagnostics
          path: |
            /tmp/podlaz-*-package-contents.txt
            /tmp/podlazd-*.service
            /tmp/podlaz-*.sysusers
            /tmp/podlaz-lintian.txt
            /tmp/podlaz-package-validation.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Install, reinstall, and purge package locally
        env:
          PODLAZ_EXPECT_VERSION: 0.0.0~dev
          PODLAZ_EXPECT_COMMIT: ci-test
          PODLAZ_EXPECT_BUILT: Jun 19 2026
        run: |
          set -o pipefail
          PODLAZ_VALIDATE_SERVICE=1 \
            bash scripts/ci/validate-package-install.sh "${DEV_DEB}" 2>&1 | tee /tmp/podlaz-package-install.txt

      - name: Upload package install diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: podlaz-package-install-diagnostics
          path: /tmp/podlaz-package-install.txt
          if-no-files-found: ignore
          retention-days: 7
