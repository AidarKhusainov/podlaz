name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          bash scripts/ci/install-go-tool.sh actionlint

      - name: Lint workflows and shell scripts
        run: |
          set -o pipefail
          bash scripts/ci/workflow-lint.sh 2>&1 | tee /tmp/podlaz-workflow-lint.txt

      - name: Repository structure contract
        run: bash scripts/ci/repository-structure-test.sh

      - name: Active repository structure
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: bash scripts/ci/repository-structure.sh

      - name: Final repository structure
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash scripts/ci/repository-structure.sh --final

      - name: Upload workflow lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-workflow-lint-diagnostics
          path: /tmp/podlaz-workflow-lint.txt
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Go and CLI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Go fmt, test, and vet
        run: |
          set -o pipefail
          bash scripts/ci/go-core.sh 2>&1 | tee /tmp/podlaz-go-core.txt

      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-go-diagnostics
          path: /tmp/podlaz-go-core.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Govulncheck
        run: |
          bash scripts/ci/install-go-tool.sh govulncheck
          govulncheck ./...

      - name: Install CLI smoke tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish

      - name: CLI smoke contract
        run: bash scripts/ci/cli-smoke.sh

      - name: CLI behavior contract
        run: bash scripts/e2e/cli-contract.sh

  deb-package:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
      ARM64_DEB: dist-arm64/podlaz_0.0.0~dev-1_linux_arm64.deb
      CI_PODLAZ_COMMIT: ci-test
      CI_PODLAZ_BUILT: Jun 19 2026
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl dpkg file lintian man-db unzip zsh fish gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build Debian packages
        run: bash scripts/ci/build-dev-packages.sh

      - name: Upload package build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-build-deb-diagnostics
          path: |
            /tmp/podlaz-build-deb-amd64.txt
            /tmp/podlaz-build-deb-arm64.txt
            /tmp/podlaz-built-version.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate package metadata and contents
        env:
          PODLAZ_LINKAGE_ROOT: dist/package-root
        run: |
          set -o pipefail
          bash scripts/ci/validate-packages.sh "${DEV_DEB}" "${ARM64_DEB}" 2>&1 | tee /tmp/podlaz-package-validation.txt

      - name: Upload package validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-package-validation-diagnostics
          path: |
            /tmp/podlaz-*-package-contents.txt
            /tmp/podlazd-*.service
            /tmp/podlaz-*.sysusers
            /tmp/podlaz-lintian.txt
            /tmp/podlaz-package-validation.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Install, reinstall, and purge package locally
        env:
          PODLAZ_EXPECT_VERSION: 0.0.0~dev
          PODLAZ_EXPECT_COMMIT: ci-test
          PODLAZ_EXPECT_BUILT: Jun 19 2026
        run: |
          set -o pipefail
          PODLAZ_VALIDATE_SERVICE=1 \
            bash scripts/ci/validate-package-install.sh "${DEV_DEB}" 2>&1 | tee /tmp/podlaz-package-install.txt

      - name: Upload package install diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-package-install-diagnostics
          path: /tmp/podlaz-package-install.txt
          if-no-files-found: ignore
          retention-days: 7
