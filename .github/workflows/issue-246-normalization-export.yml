name: Issue 246 Publish Normalization Fixes

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-publish-normalization-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    name: Publish verified normalization fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Publish verified non-workflow patch
        shell: bash
        run: bash .agent-sync/issue246/publish-normalization.sh
