name: Issue 246 Blocker Workspace Export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: issue-246-blocker-workspace-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    name: Export exact blocker workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Archive tracked workspace
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/podlaz-issue-246-blocker-workspace.tar.gz" HEAD

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-issue-246-blocker-workspace
          path: ${{ runner.temp }}/podlaz-issue-246-blocker-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
