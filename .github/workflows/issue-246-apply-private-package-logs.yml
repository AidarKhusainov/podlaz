name: Apply verified private package-log boundary

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-private-package-logs
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify, test, apply, and publish
        shell: bash
        run: |
          set -euo pipefail
          encoded='.github/issue246-private-package-logs.patch.gz.b64'
          archive="${RUNNER_TEMP}/issue246-private-package-logs.patch.gz"
          patch="${RUNNER_TEMP}/issue246-private-package-logs.patch"

          printf '%s  %s\n' 'd4ba0ede60db295e420e0f93e0110185521ca4b435f6057af6bbf1d8a1ecf94a' "${encoded}" | sha256sum --check --strict
          base64 --decode "${encoded}" >"${archive}"
          printf '%s  %s\n' 'fd28ac58d2df836e0ab71af32ca903c57286cd75e860cdfc7c27724cbdf9a36b' "${archive}" | sha256sum --check --strict
          gzip --test "${archive}"
          gzip --decompress --stdout "${archive}" >"${patch}"
          printf '%s  %s\n' '124aeb1015252d844a40ec0ce2233d4cd1c550dd90aa4589e64eba3f24b9e632' "${patch}" | sha256sum --check --strict

          git apply --check "${patch}"
          git apply --index "${patch}"
          git rm -- .github/workflows/issue-246-apply-private-package-logs.yml
          git rm -- .github/issue246-private-package-logs.patch.gz.b64
          git diff --cached --check

          python3 -m unittest discover -s scripts/e2e/tests -p 'test_*.py'
          python3 -m py_compile \
            scripts/e2e/lib/tun_soak_*.py \
            scripts/e2e/tests/test_tun_soak_*.py \
            scripts/e2e/tests/test_tun_resource_soak_contract.py
          bash -n \
            scripts/e2e/tun-resource-soak.sh \
            scripts/e2e/lib/tun_soak_health.sh \
            scripts/e2e/lib/tun_soak_cleanup.sh
          find scripts/e2e -type d -name __pycache__ -prune -exec rm -rf {} +

          git config user.name 'podlaz issue 246 automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep raw package soak logs private'
          git push origin HEAD:agent/issue-246-tun-resource-soak
