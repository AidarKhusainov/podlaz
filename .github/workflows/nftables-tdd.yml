name: Nftables TDD

on:
  push:
    branches:
      - agent/nftables-ownership-safety

permissions:
  contents: read

concurrency:
  group: nftables-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused baseline
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euxo pipefail
          go test ./internal/network/executor ./internal/daemon ./internal/doctor -count=1

      - name: Install nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables

      - name: Compile real nftables contract
        env:
          GOFLAGS: -mod=readonly
        run: go test -c -o /tmp/podlaz-executor-real-nft.test ./internal/network/executor

      - name: Real nftables Privacy Envelope round trip
        run: |
          sudo env "PATH=${PATH}" PODLAZ_TEST_REAL_NFT=1 \
            /tmp/podlaz-executor-real-nft.test \
            -test.run '^TestPrivacyEnvelopeRealNFTRoundTrip$' \
            -test.v
