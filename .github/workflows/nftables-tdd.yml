name: Nftables TDD

on:
  push:
    branches:
      - agent/nftables-ownership-safety

permissions:
  contents: read

concurrency:
  group: nftables-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve nftables mutation dependency
        run: go list -m -json github.com/google/nftables@f9b52ed2ba653815684ff3e19a4d087ff0b87332

      - name: Focused baseline
        run: |
          set -euxo pipefail
          go test ./internal/network/executor ./internal/daemon ./internal/doctor -count=1
