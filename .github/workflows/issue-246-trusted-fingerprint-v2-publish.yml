name: Issue 246 Publish Trusted Fingerprint V2

on:
  push:
    branches:
      - agent/issue-246-tun-resource-soak

permissions:
  contents: write

concurrency:
  group: issue-246-trusted-fingerprint-v2-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    name: Verify and publish trusted uplink semantic binding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: agent/issue-246-tun-resource-soak
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify exact review fix
        shell: bash
        run: |
          set -euo pipefail

          readonly expected_parent='e66dd1ea9f1358336e06345109330a760db37f98'
          readonly publisher_path='.github/workflows/issue-246-trusted-fingerprint-v2-publish.yml'

          [[ "$(git rev-parse HEAD^)" == "${expected_parent}" ]] || {
            echo 'publisher parent is not the reviewed exact head' >&2
            exit 1
          }
          mapfile -t publisher_changes < <(git diff-tree --no-commit-id --name-only -r HEAD)
          [[ "${#publisher_changes[@]}" -eq 1 && "${publisher_changes[0]}" == "${publisher_path}" ]] || {
            printf 'unexpected publisher commit paths: %s\n' "${publisher_changes[*]}" >&2
            exit 1
          }

          cat > "${RUNNER_TEMP}/trusted-fingerprint-v2.patch.xz.b64" <<'B64'
          
          B64
          base64 -d "${RUNNER_TEMP}/trusted-fingerprint-v2.patch.xz.b64" > "${RUNNER_TEMP}/trusted-fingerprint-v2.patch.xz"
          printf '%s  %s\n' \
            'd181b59cd4b7db228816a790aa6dde3397691a0b670ce5b3544cf94b9f325dcc' \
            "${RUNNER_TEMP}/trusted-fingerprint-v2.patch.xz" | sha256sum -c -
          xz -dc "${RUNNER_TEMP}/trusted-fingerprint-v2.patch.xz" > "${RUNNER_TEMP}/trusted-fingerprint-v2.patch"
          printf '%s  %s\n' \
            'afc7d816fc539b5a719bef28cb20505aea8be1b57272284f9295b544bdb3d15b' \
            "${RUNNER_TEMP}/trusted-fingerprint-v2.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/trusted-fingerprint-v2.patch"
          git apply "${RUNNER_TEMP}/trusted-fingerprint-v2.patch"

          python3 -m py_compile scripts/e2e/*.py scripts/e2e/lib/*.py scripts/e2e/tests/*.py
          python3 -m unittest discover -s scripts/e2e/tests -p 'test_*.py'
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts/e2e -type f -name '*.sh' -print0)
          find scripts/e2e -type d -name __pycache__ -prune -exec rm -rf {} +

          grep -RIn 'podlaz.e2e.trusted-host.v2' \
            scripts/e2e/lib/tun_soak_isolation.py \
            scripts/e2e/tests/test_tun_soak_isolation.py \
            docs/e2e.md
          ! grep -RIn 'default_ipv4_gateway\|global_ipv4_cidrs' \
            scripts/e2e/lib/tun_soak_isolation.py \
            scripts/e2e/tests/test_tun_soak_isolation.py \
            docs/e2e.md

          mapfile -t actual_paths < <(git diff --name-only | sort)
          mapfile -t expected_paths <<'PATHS'
          docs/e2e.md
          scripts/e2e/lib/tun_soak_isolation.py
          scripts/e2e/tests/test_tun_soak_isolation.py
          PATHS
          mapfile -t expected_paths < <(printf '%s\n' "${expected_paths[@]}" | sort)
          diff -u \
            <(printf '%s\n' "${expected_paths[@]}") \
            <(printf '%s\n' "${actual_paths[@]}")
          git diff --check

      - name: Commit and publish exact verified changes
        shell: bash
        run: |
          set -euo pipefail

          remote_head="$(git ls-remote --heads origin refs/heads/agent/issue-246-tun-resource-soak | awk '{print $1}')"
          [[ -n "${remote_head}" && "${remote_head}" == "$(git rev-parse HEAD)" ]] || {
            echo 'branch head changed while verification was running' >&2
            exit 1
          }

          git add -- \
            docs/e2e.md \
            scripts/e2e/lib/tun_soak_isolation.py \
            scripts/e2e/tests/test_tun_soak_isolation.py
          git diff --cached --check
          [[ -z "$(git status --short | grep '^??' || true)" ]]

          git config user.name 'podlaz issue 246 automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: bind trusted uplink semantic identity'
          git push origin HEAD:agent/issue-246-tun-resource-soak
