name: Apply verified Issue 246 harness fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-apply-local-fix
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify, apply, and publish tested patch
        shell: bash
        run: |
          set -euo pipefail
          encoded="${RUNNER_TEMP}/issue-246.patch.gz.b64"
          archive="${RUNNER_TEMP}/issue-246.patch.gz"
          patch="${RUNNER_TEMP}/issue-246.patch"
          cat .github/issue246-patch/part-* >"${encoded}"
          printf '%s  %s\n' 'efff92d85452e3e369d344aee2e153558a8f97d9577891ca226d3268becd7c50' "${encoded}" | sha256sum --check --strict
          base64 --decode "${encoded}" >"${archive}"
          printf '%s  %s\n' '1900a6b2d4422e7fd77de3ed0372a0a54b29a88502d0a6ca552f1d45a6a1700f' "${archive}" | sha256sum --check --strict
          gzip --test "${archive}"
          gzip --decompress --stdout "${archive}" >"${patch}"
          printf '%s  %s\n' '1850f455f2e2ac13aebbbb060e29656217a9c63a0dafd6fcff6cdee294d7c8e2' "${patch}" | sha256sum --check --strict
          git apply --check "${patch}"
          git apply --index "${patch}"
          git rm -- .github/workflows/issue-246-apply-local-fix.yml
          git rm -r -- .github/issue246-patch
          git diff --cached --check
          git config user.name "podlaz issue 246 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep resource soak diagnostics and cleanup bounded"
          git push origin HEAD:agent/issue-246-tun-resource-soak
