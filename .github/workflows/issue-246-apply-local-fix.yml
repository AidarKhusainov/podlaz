name: Apply verified Issue 246 harness fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-apply-local-fix
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply tested patch and publish
        shell: bash
        run: |
          set -euo pipefail
          encoded="${RUNNER_TEMP}/issue-246.patch.gz.b64"
          patch="${RUNNER_TEMP}/issue-246.patch"
          cat >"${encoded}" <<'PATCH_B64'
          
          PATCH_B64
          tr -d '[:space:]' <"${encoded}" | base64 --decode | gzip --decompress >"${patch}"
          git apply --check "${patch}"
          git apply --index "${patch}"
          git rm -- .github/workflows/issue-246-apply-local-fix.yml
          git diff --cached --check
          git config user.name "podlaz issue 246 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep resource soak diagnostics and cleanup bounded"
          git push origin HEAD:agent/issue-246-tun-resource-soak
