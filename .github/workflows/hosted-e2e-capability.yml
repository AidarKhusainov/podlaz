name: Hosted E2E Capability

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - agent/github-hosted-e2e-qualification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-e2e-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability:
    name: Disposable guest capability
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install capability tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cloud-image-utils \
            debootstrap \
            jq \
            nftables \
            openssh-client \
            qemu-system-x86 \
            qemu-utils \
            systemd-container
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ github.sha }}
          PODLAZ_BUILT: Sep 14 2026
        run: bash scripts/build-deb.sh

      - name: Capability contract
        run: go test ./scripts/e2e -run '^TestHostedE2ECapability' -count=1

      - name: Inspect outer forward policy
        run: |
          if command -v iptables >/dev/null 2>&1; then
            forward_policy="$(sudo -n iptables -S FORWARD 2>/dev/null | sed -n '1p')"
            case "${forward_policy}" in
              '-P FORWARD ACCEPT') printf '%s\n' 'outer.forward.iptables_policy=accept' ;;
              '-P FORWARD DROP') printf '%s\n' 'outer.forward.iptables_policy=drop' ;;
              *) printf '%s\n' 'outer.forward.iptables_policy=other' ;;
            esac
          else
            printf '%s\n' 'outer.forward.iptables_policy=unavailable'
          fi

      - name: Run disposable guest capability
        id: capability
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-capability-public
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}"
          install -d -m 0700 "${E2E_ARTIFACT_DIR}"

          # systemd-nspawn mounts /tmp as tmpfs. Restage the exact built
          # candidate after the machine exists so the package install sees it.
          # Stage candidate into live guest tmpfs.
          candidate_log="${E2E_TMP_ROOT}/hosted-capability-private/candidate-install.log"
          argv_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-import-argv.log"
          transport_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-import-transport.log"
          connect_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-connect-classification.log"
          connect_exit_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-connect-exit.log"
          connect_daemon_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-connect-daemon.log"
          resolved_query_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-resolved-query.log"
          udp_dns_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-direct-udp-dns.log"
          capture_pid=""
          argv_capture_pid=""
          transport_capture_pid=""
          connect_capture_pid=""
          cleanup_capture() {
            if [[ -n "${capture_pid}" ]]; then
              kill "${capture_pid}" >/dev/null 2>&1 || true
              wait "${capture_pid}" >/dev/null 2>&1 || true
              capture_pid=""
            fi
            if [[ -n "${argv_capture_pid}" ]]; then
              kill "${argv_capture_pid}" >/dev/null 2>&1 || true
              wait "${argv_capture_pid}" >/dev/null 2>&1 || true
              argv_capture_pid=""
            fi
            if [[ -n "${transport_capture_pid}" ]]; then
              kill "${transport_capture_pid}" >/dev/null 2>&1 || true
              wait "${transport_capture_pid}" >/dev/null 2>&1 || true
              transport_capture_pid=""
            fi
            if [[ -n "${connect_capture_pid}" ]]; then
              kill "${connect_capture_pid}" >/dev/null 2>&1 || true
              wait "${connect_capture_pid}" >/dev/null 2>&1 || true
              connect_capture_pid=""
            fi
          }
          trap cleanup_capture EXIT

          bash scripts/e2e/hosted-e2e-capability.sh "${DEV_DEB}" &
          capability_pid=$!
          (
            for _ in $(seq 1 2400); do
              if ! kill -0 "${capability_pid}" >/dev/null 2>&1; then
                exit 0
              fi
              if machinectl show podlaz-capability >/dev/null 2>&1; then
                if ! sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- /bin/bash -lc "install -m 0644 '/workspace/${DEV_DEB}' /tmp/.candidate.deb && mv -f /tmp/.candidate.deb /tmp/candidate.deb" \
                  >/dev/null 2>&1; then
                  sleep 0.1
                  continue
                fi

                # Capture volatile package install diagnostics while the
                # nspawn /run namespace still exists. This is read-only.
                if {
                  sudo -n systemd-run \
                    --machine=podlaz-capability \
                    --wait --pipe --collect --quiet \
                    -- /bin/bash -lc 'while [ ! -s /run/podlaz-capability-apt.log ]; do sleep 0.05; done; tail -n 120 /run/podlaz-capability-apt.log'
                } >"${candidate_log}.tmp" 2>/dev/null; then
                  mv -f "${candidate_log}.tmp" "${candidate_log}"
                  chmod 0600 "${candidate_log}"
                  exit 0
                fi
                rm -f "${candidate_log}.tmp"
              fi
              sleep 0.1
            done
          ) &
          capture_pid=$!

          (
            uri_path="${E2E_TMP_ROOT}/hosted-capability-private/synthetic-xray/client-uri"
            punctuation='vless://probe@192.0.2.1:443?type=tcp&security=none&encryption=none#hosted-capability'
            for _ in $(seq 1 2400); do
              if [[ -s "${uri_path}" ]] && machinectl show podlaz-capability >/dev/null 2>&1; then
                printf '%s\n' 'tun.synthetic_uri_host_loaded=pass' >"${transport_log}.tmp"
                uri="$(<"${uri_path}")"
                uri_len="${#uri}"
                uri_sha="$(printf '%s' "${uri}" | sha256sum | awk '{print $1}')"

                if sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- /bin/bash -lc '[[ "$1" == podlaz-hosted-argv-probe ]]' _ podlaz-hosted-argv-probe \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.guest_argv_transport=pass' >>"${transport_log}.tmp"
                else
                  printf '%s\n' 'tun.guest_argv_transport=fail' >>"${transport_log}.tmp"
                fi

                if sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- /bin/bash -lc '[[ "$1" == "$2" ]]' _ "${punctuation}" "${punctuation}" \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.guest_uri_punctuation_transport=pass' >>"${transport_log}.tmp"
                else
                  printf '%s\n' 'tun.guest_uri_punctuation_transport=fail' >>"${transport_log}.tmp"
                fi

                if sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- /bin/bash -lc '[[ "${#1}" == "$2" ]]' _ "${uri}" "${uri_len}" \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.synthetic_uri_argv_length=pass' >>"${transport_log}.tmp"
                else
                  printf '%s\n' 'tun.synthetic_uri_argv_length=fail' >>"${transport_log}.tmp"
                fi

                if sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- /bin/bash -lc 'actual="$(printf "%s" "$1" | sha256sum)"; [[ "${actual%% *}" == "$2" ]]' _ "${uri}" "${uri_sha}" \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.synthetic_uri_argv_integrity=pass' >>"${transport_log}.tmp"
                else
                  printf '%s\n' 'tun.synthetic_uri_argv_integrity=fail' >>"${transport_log}.tmp"
                fi

                if sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- test -e /run/podlaz-capability-xray/client-uri \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.synthetic_uri_bind_exists=pass' >>"${transport_log}.tmp"
                else
                  printf '%s\n' 'tun.synthetic_uri_bind_exists=fail' >>"${transport_log}.tmp"
                fi

                if sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- test -r /run/podlaz-capability-xray/client-uri \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.synthetic_uri_bind_readable=pass' >>"${transport_log}.tmp"
                else
                  printf '%s\n' 'tun.synthetic_uri_bind_readable=fail' >>"${transport_log}.tmp"
                fi

                if sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- test -s /run/podlaz-capability-xray/client-uri \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.synthetic_uri_bind_nonempty=pass' >>"${transport_log}.tmp"
                else
                  printf '%s\n' 'tun.synthetic_uri_bind_nonempty=fail' >>"${transport_log}.tmp"
                fi

                set +e
                sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- /bin/bash -lc 'test -s /run/podlaz-capability-xray/client-uri || exit 91; URI="$(cat /run/podlaz-capability-xray/client-uri)" || exit 92; [[ -n "${URI}" ]] || exit 90' \
                  >/dev/null 2>&1
                import_shell_rc=$?
                set -e
                case "${import_shell_rc}" in
                  0)
                    printf '%s\n' 'tun.synthetic_uri_import_shell_stat=pass' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_read=pass' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_nonempty=pass' >>"${transport_log}.tmp"
                    ;;
                  90)
                    printf '%s\n' 'tun.synthetic_uri_import_shell_stat=pass' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_read=pass' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_nonempty=fail' >>"${transport_log}.tmp"
                    ;;
                  91)
                    printf '%s\n' 'tun.synthetic_uri_import_shell_stat=fail' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_read=unavailable' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_nonempty=unavailable' >>"${transport_log}.tmp"
                    ;;
                  92)
                    printf '%s\n' 'tun.synthetic_uri_import_shell_stat=pass' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_read=fail' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_nonempty=unavailable' >>"${transport_log}.tmp"
                    ;;
                  *)
                    printf '%s\n' 'tun.synthetic_uri_import_shell_stat=unavailable' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_read=unavailable' >>"${transport_log}.tmp"
                    printf '%s\n' 'tun.synthetic_uri_import_shell_nonempty=unavailable' >>"${transport_log}.tmp"
                    ;;
                esac

                mv -f "${transport_log}.tmp" "${transport_log}"
                chmod 0600 "${transport_log}"
                exit 0
              fi
              if ! kill -0 "${capability_pid}" >/dev/null 2>&1; then
                printf '%s\n' 'tun.synthetic_uri_host_loaded=fail' >"${transport_log}.tmp"
                mv -f "${transport_log}.tmp" "${transport_log}"
                chmod 0600 "${transport_log}"
                exit 0
              fi
              sleep 0.1
            done
          ) &
          transport_capture_pid=$!

          (
            for _ in $(seq 1 2400); do
              if machinectl show podlaz-capability >/dev/null 2>&1; then
                if {
                  sudo -n systemd-run \
                    --machine=podlaz-capability \
                    --wait --pipe --collect --quiet \
                    -- /bin/bash -lc '
                      while [ ! -s /tmp/podlaz-capability-tun-private/import.stderr ]; do sleep 0.05; done
                      if grep -Fq "profile import requires a share URI" /tmp/podlaz-capability-tun-private/import.stderr; then
                        printf "%s\n" "tun.profile_import_arg_requires_uri=observed"
                      elif grep -Fq "profile import accepts exactly one share URI" /tmp/podlaz-capability-tun-private/import.stderr; then
                        printf "%s\n" "tun.profile_import_arg_multiple_uri=observed"
                      elif grep -Fq "unsupported profile import argument" /tmp/podlaz-capability-tun-private/import.stderr; then
                        printf "%s\n" "tun.profile_import_arg_unsupported=observed"
                      elif grep -Fq "profile import --json is not implemented" /tmp/podlaz-capability-tun-private/import.stderr; then
                        printf "%s\n" "tun.profile_import_arg_json=observed"
                      fi
                    '
                } >"${argv_log}.tmp" 2>/dev/null; then
                  if [[ -s "${argv_log}.tmp" ]]; then
                    mv -f "${argv_log}.tmp" "${argv_log}"
                    chmod 0600 "${argv_log}"
                  else
                    rm -f "${argv_log}.tmp"
                  fi
                  exit 0
                fi
                rm -f "${argv_log}.tmp"
              fi
              if ! kill -0 "${capability_pid}" >/dev/null 2>&1; then
                exit 0
              fi
              sleep 0.1
            done
          ) &
          argv_capture_pid=$!

          (
            profile_stage=false
            runuser_stage=false
            stderr_classified=false
            daemon_classified=false
            resolved_query_classified=false
            udp_dns_classified=false
            connect_exit_dir="$(dirname "${connect_exit_log}")"
            while [[ ! -d "${connect_exit_dir}" ]]; do
              if ! kill -0 "${capability_pid}" >/dev/null 2>&1; then
                exit 0
              fi
              sleep 0.1
            done
            : >"${connect_exit_log}.tmp"
            chmod 0600 "${connect_exit_log}.tmp"
            for _ in $(seq 1 2400); do
              guest_live=false
              if machinectl show podlaz-capability >/dev/null 2>&1; then
                guest_live=true
                if [[ "${profile_stage}" == false ]] && sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- test -s /tmp/podlaz-capability-tun-private/profile-id \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.connect.stage_profile_id=observed' >>"${connect_exit_log}.tmp"
                  profile_stage=true
                fi
                if [[ "${runuser_stage}" == false ]] && sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --wait --pipe --collect --quiet \
                  -- /bin/bash -lc 'test -e /tmp/podlaz-capability-tun-private/connect.stdout && test -e /tmp/podlaz-capability-tun-private/connect.stderr' \
                  >/dev/null 2>&1; then
                  printf '%s\n' 'tun.connect.stage_runuser=observed' >>"${connect_exit_log}.tmp"
                  runuser_stage=true
                fi
                if [[ "${stderr_classified}" == false ]] && {
                  sudo -n systemd-run \
                    --machine=podlaz-capability \
                    --expand-environment=no \
                    --wait --pipe --collect --quiet \
                    -- /bin/bash -lc '
                      stderr=/tmp/podlaz-capability-tun-private/connect.stderr
                      test -s "${stderr}" || exit 3
                      if grep -Fqi "authorization denied" "${stderr}"; then
                        printf "%s\n" "tun.connect.authorization_denied=observed"
                      elif grep -Fqi "authorization unavailable" "${stderr}"; then
                        printf "%s\n" "tun.connect.authorization_unavailable=observed"
                      elif grep -Eqi "daemon socket .*permission denied|permission denied.*daemon socket" "${stderr}"; then
                        printf "%s\n" "tun.connect.socket_permission=observed"
                      elif grep -Eqi "daemon connect|connection already active|full[- ]tunnel|handoff|stale podlaz|xray|runtime|resolve|verification|tun|route|nft|dns" "${stderr}"; then
                        printf "%s\n" "tun.connect.daemon_error=observed"
                      else
                        printf "%s\n" "tun.connect.other_error=observed"
                      fi
                    '
                } >"${connect_log}.tmp" 2>/dev/null; then
                  if [[ -s "${connect_log}.tmp" ]]; then
                    mv -f "${connect_log}.tmp" "${connect_log}"
                    chmod 0600 "${connect_log}"
                    stderr_classified=true
                  fi
                else
                  rm -f "${connect_log}.tmp"
                fi
                if [[ "${resolved_query_classified}" == false ]] && {
                  sudo -n systemd-run \
                    --machine=podlaz-capability \
                    --expand-environment=no \
                    --wait --pipe --collect --quiet \
                    -- /bin/bash -lc '
                      test -e /sys/class/net/podlaz0/ifindex || exit 3
                      status="$(resolvectl status podlaz0 --no-pager 2>/dev/null)" || exit 3
                      grep -Fq "DNS Servers:" <<<"${status}" || exit 3
                      grep -Fq "~." <<<"${status}" || exit 3
                      if grep -Eq "Current Scopes:.*(^|[[:space:]])DNS([[:space:]]|$)" <<<"${status}"; then
                        printf "%s\n" "tun.resolved_query.scope_dns=observed"
                      else
                        printf "%s\n" "tun.resolved_query.scope_not_dns=observed"
                      fi
                      ifindex="$(cat /sys/class/net/podlaz0/ifindex)"
                      stdout=/tmp/podlaz-capability-resolved-query.stdout
                      stderr=/tmp/podlaz-capability-resolved-query.stderr
                      set +e
                      resolvectl --cache=no --interface="${ifindex}" -4 query example.com >"${stdout}" 2>"${stderr}"
                      rc=$?
                      set -e
                      if (( rc == 0 )); then
                        printf "%s\n" "tun.resolved_query.exit_zero=observed"
                      else
                        printf "%s\n" "tun.resolved_query.exit_nonzero=observed"
                      fi
                      if [[ -s "${stderr}" ]]; then
                        printf "%s\n" "tun.resolved_query.stderr_nonempty=observed"
                        if grep -Eqi "timed out|timeout|all attempts .*failed" "${stderr}"; then
                          printf "%s\n" "tun.resolved_query.stderr_timeout=observed"
                        elif grep -Eqi "no appropriate name servers|no suitable .*server|no suitable .*network|no name servers|network .*unavailable" "${stderr}"; then
                          printf "%s\n" "tun.resolved_query.stderr_no_suitable_server=observed"
                        elif grep -Eqi "link|interface|device|no such device|not found" "${stderr}"; then
                          printf "%s\n" "tun.resolved_query.stderr_link_device=observed"
                        else
                          printf "%s\n" "tun.resolved_query.stderr_other=observed"
                        fi
                      else
                        printf "%s\n" "tun.resolved_query.stderr_empty=observed"
                      fi
                      if grep -Fq " -- link: podlaz0" "${stdout}"; then
                        printf "%s\n" "tun.resolved_query.expected_link=observed"
                      else
                        printf "%s\n" "tun.resolved_query.expected_link_missing=observed"
                      fi
                      if grep -Eq "(^|[^0-9])([0-9]{1,3}\\.){3}[0-9]{1,3}([^0-9]|$)" "${stdout}"; then
                        printf "%s\n" "tun.resolved_query.ipv4_answer=observed"
                      else
                        printf "%s\n" "tun.resolved_query.ipv4_answer_missing=observed"
                      fi
                      rm -f -- "${stdout}" "${stderr}"
                    '
                } >"${resolved_query_log}.tmp" 2>/dev/null; then
                  if [[ -s "${resolved_query_log}.tmp" ]]; then
                    mv -f "${resolved_query_log}.tmp" "${resolved_query_log}"
                    chmod 0600 "${resolved_query_log}"
                    resolved_query_classified=true
                  fi
                else
                  rm -f "${resolved_query_log}.tmp"
                fi
                if [[ "${udp_dns_classified}" == false ]] && sudo -n systemd-run \
                  --machine=podlaz-capability \
                  --expand-environment=no \
                  --wait --pipe --collect --quiet \
                  -- /usr/bin/python3 -c '
import socket, struct
query = struct.pack("!HHHHHH", 0x505A, 0x0100, 1, 0, 0, 0) + b"\x07example\x03com\x00" + struct.pack("!HH", 1, 1)
sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
sock.settimeout(5)
try:
    sock.sendto(query, ("1.1.1.1", 53))
    data, _ = sock.recvfrom(4096)
    if len(data) >= 12 and data[:2] == query[:2]:
        print("tun.resolved_query.udp_dns_response=observed")
    else:
        print("tun.resolved_query.udp_dns_error=observed")
except socket.timeout:
    print("tun.resolved_query.udp_dns_timeout=observed")
except OSError:
    print("tun.resolved_query.udp_dns_error=observed")
finally:
    sock.close()
' >"${udp_dns_log}.tmp" 2>/dev/null; then
                  if [[ -s "${udp_dns_log}.tmp" ]]; then
                    mv -f "${udp_dns_log}.tmp" "${udp_dns_log}"
                    chmod 0600 "${udp_dns_log}"
                    udp_dns_classified=true
                  fi
                else
                  rm -f "${udp_dns_log}.tmp"
                fi
                if [[ "${daemon_classified}" == false ]] && {
                  sudo -n systemd-run \
                    --machine=podlaz-capability \
                    --expand-environment=no \
                    --wait --pipe --collect --quiet \
                    -- /bin/bash -lc '
                      line="$(journalctl -u podlazd --no-pager -n 120 | grep -F "podlazd: connect request failed" | tail -n 1)"
                      test -n "${line}" || exit 3
                      field() {
                        local key="$1" token
                        for token in ${line}; do
                          case "${token}" in
                            "${key}="*) printf "%s" "${token#*=}"; return 0 ;;
                          esac
                        done
                        return 1
                      }
                      classification="$(field classification)" || exit 4
                      phase="$(field phase)" || exit 4
                      rollback="$(field rollback_status)" || exit 4
                      primary="$(field tun_primary_classification)" || exit 4
                      for value in "${classification}" "${phase}" "${rollback}" "${primary}"; do
                        [[ "${value}" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 4
                      done
                      printf "%s\n" "tun.connect.exit_generic=observed"
                      printf "tun.connect.daemon_classification_%s=observed\n" "${classification}"
                      printf "tun.connect.daemon_phase_%s=observed\n" "${phase}"
                      printf "tun.connect.daemon_rollback_%s=observed\n" "${rollback}"
                      printf "tun.connect.tun_primary_%s=observed\n" "${primary}"
                    '
                } >"${connect_daemon_log}.tmp" 2>/dev/null; then
                  if [[ -s "${connect_daemon_log}.tmp" ]]; then
                    mv -f "${connect_daemon_log}.tmp" "${connect_daemon_log}"
                    chmod 0600 "${connect_daemon_log}"
                    daemon_classified=true
                  fi
                else
                  rm -f "${connect_daemon_log}.tmp"
                fi
              fi

              if grep -Fx 'tun.connect_requested=pass' "${E2E_ARTIFACT_DIR}/hosted-e2e-capability.txt" >/dev/null 2>&1; then
                printf '%s\n' 'tun.connect.exit_zero=observed' >>"${connect_exit_log}.tmp"
                mv -f "${connect_exit_log}.tmp" "${connect_exit_log}"
                chmod 0600 "${connect_exit_log}"
                exit 0
              fi
              if [[ "${runuser_stage}" == true && "${guest_live}" == false ]] && \
                  grep -Fx 'tun.profile_validate=pass' "${E2E_ARTIFACT_DIR}/hosted-e2e-capability.txt" >/dev/null 2>&1; then
                printf '%s\n' 'tun.connect.exit_nonzero=observed' >>"${connect_exit_log}.tmp"
                mv -f "${connect_exit_log}.tmp" "${connect_exit_log}"
                chmod 0600 "${connect_exit_log}"
                exit 0
              fi
              if ! kill -0 "${capability_pid}" >/dev/null 2>&1; then
                if [[ "${runuser_stage}" == true ]] && \
                    grep -Fx 'tun.profile_validate=pass' "${E2E_ARTIFACT_DIR}/hosted-e2e-capability.txt" >/dev/null 2>&1; then
                  printf '%s\n' 'tun.connect.exit_nonzero=observed' >>"${connect_exit_log}.tmp"
                fi
                if [[ -s "${connect_exit_log}.tmp" ]]; then
                  mv -f "${connect_exit_log}.tmp" "${connect_exit_log}"
                  chmod 0600 "${connect_exit_log}"
                else
                  rm -f "${connect_exit_log}.tmp"
                fi
                exit 0
              fi
              sleep 0.1
            done
          ) &
          connect_capture_pid=$!

          set +e
          wait "${capability_pid}"
          capability_rc=$?
          set -e
          cleanup_capture
          trap - EXIT
          exit "${capability_rc}"

      - name: Collect bounded package install diagnostics
        if: failure()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
        run: |
          guest_root="${E2E_TMP_ROOT}/system-guest"
          apt_log="${guest_root}/var/log/apt/term.log"
          dpkg_log="${guest_root}/var/log/dpkg.log"
          candidate_log="${E2E_TMP_ROOT}/hosted-capability-private/candidate-install.log"
          argv_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-import-argv.log"
          transport_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-import-transport.log"
          connect_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-connect-classification.log"
          connect_exit_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-connect-exit.log"
          connect_daemon_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-connect-daemon.log"
          resolved_query_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-resolved-query.log"
          udp_dns_log="${E2E_TMP_ROOT}/hosted-capability-private/profile-direct-udp-dns.log"
          touch "${candidate_log}"
          chmod 0600 "${candidate_log}"
          if sudo -n test -f "${apt_log}"; then
            sudo -n tail -n 80 "${apt_log}" | tee -a "${candidate_log}"
          fi
          if sudo -n test -x "${guest_root}/usr/bin/dpkg-query"; then
            sudo -n chroot "${guest_root}" dpkg-query -W -f='candidate.package.status=${db:Status-Status}\n' podlaz 2>/dev/null | tee -a "${candidate_log}" || true
          fi
          if sudo -n test -f "${dpkg_log}"; then
            sudo -n grep -F ' podlaz ' "${dpkg_log}" | tail -n 20 | tee -a "${candidate_log}" || true
          fi
          tail -n 140 "${candidate_log}"
          if [[ -s "${argv_log}" ]]; then
            cat "${argv_log}"
          fi
          if [[ -s "${transport_log}" ]]; then
            cat "${transport_log}"
          fi
          if [[ -s "${connect_log}" ]]; then
            cat "${connect_log}"
          fi
          if [[ -s "${connect_exit_log}" ]]; then
            cat "${connect_exit_log}"
          fi
          if [[ -s "${connect_daemon_log}" ]]; then
            cat "${connect_daemon_log}"
          fi
          if [[ -s "${resolved_query_log}" ]]; then
            cat "${resolved_query_log}"
          fi
          if [[ -s "${udp_dns_log}" ]]; then
            cat "${udp_dns_log}"
          fi

      - name: Validate public capability report
        id: report_validation
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-capability-public
        run: bash scripts/e2e/hosted-e2e-capability.sh validate-report

      - name: Remove private capability state
        id: private_cleanup
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload capability evidence
        if: ${{ always() && steps.report_validation.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-hosted-e2e-capability
          path: ${{ runner.temp }}/podlaz-hosted-capability-public/hosted-e2e-capability.txt
          if-no-files-found: error
          retention-days: 7
