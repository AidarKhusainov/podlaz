name: Hosted E2E Capability

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - agent/github-hosted-e2e-qualification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-e2e-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability:
    name: Disposable guest capability
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install capability tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cloud-image-utils \
            debootstrap \
            jq \
            nftables \
            openssh-client \
            qemu-system-x86 \
            qemu-utils \
            systemd-container
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ github.sha }}
          PODLAZ_BUILT: Sep 14 2026
        run: bash scripts/build-deb.sh

      - name: Capability contract
        run: go test ./scripts/e2e -run '^TestHostedE2ECapability' -count=1

      - name: Inspect outer forward policy
        run: |
          if command -v iptables >/dev/null 2>&1; then
            forward_policy="$(sudo -n iptables -S FORWARD 2>/dev/null | sed -n '1p')"
            case "${forward_policy}" in
              '-P FORWARD ACCEPT') printf '%s\n' 'outer.forward.iptables_policy=accept' ;;
              '-P FORWARD DROP') printf '%s\n' 'outer.forward.iptables_policy=drop' ;;
              *) printf '%s\n' 'outer.forward.iptables_policy=other' ;;
            esac
          else
            printf '%s\n' 'outer.forward.iptables_policy=unavailable'
          fi

      - name: Run disposable guest capability
        id: capability
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-capability-public
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}"
          install -d -m 0700 "${E2E_ARTIFACT_DIR}"

          # Capture volatile package install diagnostics while the nspawn /run
          # namespace still exists. This watcher is read-only and private.
          candidate_log="${E2E_TMP_ROOT}/hosted-capability-private/candidate-install.log"
          capture_pid=""
          cleanup_capture() {
            if [[ -n "${capture_pid}" ]]; then
              kill "${capture_pid}" >/dev/null 2>&1 || true
              wait "${capture_pid}" >/dev/null 2>&1 || true
              capture_pid=""
            fi
          }
          trap cleanup_capture EXIT

          bash scripts/e2e/hosted-e2e-capability.sh "${DEV_DEB}" &
          capability_pid=$!
          (
            for _ in $(seq 1 2400); do
              if ! kill -0 "${capability_pid}" >/dev/null 2>&1; then
                exit 0
              fi
              if machinectl show podlaz-capability >/dev/null 2>&1; then
                if {
                  sudo -n systemd-run \
                    --machine=podlaz-capability \
                    --wait --pipe --collect --quiet \
                    -- /bin/bash -lc 'while [ ! -s /run/podlaz-capability-apt.log ]; do sleep 0.05; done; tail -n 120 /run/podlaz-capability-apt.log'
                } >"${candidate_log}.tmp" 2>/dev/null; then
                  mv -f "${candidate_log}.tmp" "${candidate_log}"
                  chmod 0600 "${candidate_log}"
                  exit 0
                fi
                rm -f "${candidate_log}.tmp"
              fi
              sleep 0.1
            done
          ) &
          capture_pid=$!

          set +e
          wait "${capability_pid}"
          capability_rc=$?
          set -e
          cleanup_capture
          trap - EXIT
          exit "${capability_rc}"

      - name: Collect bounded package install diagnostics
        if: failure()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
        run: |
          guest_root="${E2E_TMP_ROOT}/system-guest"
          apt_log="${guest_root}/var/log/apt/term.log"
          dpkg_log="${guest_root}/var/log/dpkg.log"
          candidate_log="${E2E_TMP_ROOT}/hosted-capability-private/candidate-install.log"
          touch "${candidate_log}"
          chmod 0600 "${candidate_log}"
          if sudo -n test -f "${apt_log}"; then
            sudo -n tail -n 80 "${apt_log}" | tee -a "${candidate_log}"
          fi
          if sudo -n test -x "${guest_root}/usr/bin/dpkg-query"; then
            sudo -n chroot "${guest_root}" dpkg-query -W -f='candidate.package.status=${db:Status-Status}\n' podlaz 2>/dev/null | tee -a "${candidate_log}" || true
          fi
          if sudo -n test -f "${dpkg_log}"; then
            sudo -n grep -F ' podlaz ' "${dpkg_log}" | tail -n 20 | tee -a "${candidate_log}" || true
          fi
          tail -n 140 "${candidate_log}"

      - name: Validate public capability report
        id: report_validation
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-capability-public
        run: bash scripts/e2e/hosted-e2e-capability.sh validate-report

      - name: Remove private capability state
        id: private_cleanup
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-capability-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload capability evidence
        if: ${{ always() && steps.report_validation.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-hosted-e2e-capability
          path: ${{ runner.temp }}/podlaz-hosted-capability-public/hosted-e2e-capability.txt
          if-no-files-found: error
          retention-days: 7
