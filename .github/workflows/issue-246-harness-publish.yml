name: Issue 246 Harness Publish

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: issue-246-harness-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/issue-246-tun-resource-soak'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact payload commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify, test, and publish harness update
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/issue-246-privacy.patch.gz.b64
          if [[ ! -f "${payload}" ]]; then
            echo 'No harness payload remains; nothing to publish.'
            exit 0
          fi

          echo 'e5d8986fc979f0dee15fd9d5e1a709ef6a98e80b6a1714d9644a0660bc1c7834  .github/issue-246-privacy.patch.gz.b64' | sha256sum --check --strict
          base64 --decode "${payload}" > /tmp/issue-246-privacy.patch.gz
          echo 'e9607aaf58e98705e4efaaa3bacb3e92430e7a3019ae7033e3b928b4bf312796  /tmp/issue-246-privacy.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/issue-246-privacy.patch.gz > /tmp/issue-246-privacy.patch
          echo '84945cff7f8574f60596c6a9abc479de87f54a81bcdcfa38e8600f4d0facb612  /tmp/issue-246-privacy.patch' | sha256sum --check --strict

          git apply --check /tmp/issue-246-privacy.patch
          git apply --index /tmp/issue-246-privacy.patch
          git rm -- "${payload}"

          bash -n scripts/e2e/tun-resource-soak.sh
          python3 - <<'PY'
          from pathlib import Path
          for root in ('scripts/e2e', 'scripts/e2e/lib', 'scripts/e2e/tests'):
              for path in Path(root).glob('*.py'):
                  compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/e2e/tests -p 'test_*.py'
          find scripts/e2e -type d -name __pycache__ -prune -exec rm -rf -- {} +
          git add -A
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: harden TUN resource soak evidence privacy'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
