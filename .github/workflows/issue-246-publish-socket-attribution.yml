name: Issue 246 Publish Socket Attribution

on:
  push:
    branches:
      - agent/issue-246-tun-resource-soak

permissions:
  contents: write

concurrency:
  group: issue-246-publish-socket-attribution
  cancel-in-progress: true

jobs:
  publish:
    name: Apply and verify socket protocol attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-246-tun-resource-soak
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified patch and prepare extended observation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/issue-246-socket-protocol.patch
          git apply .github/issue-246-socket-protocol.patch
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue-246-resource-observation.yml')
          target = Path('.github/workflows/issue-246-self-hosted-observation.yml')
          text = source.read_text(encoding='utf-8')
          replacements = (
              ('name: Issue 246 Resource Observation', 'name: Issue 246 Extended Resource Observation'),
              ('group: issue-246-resource-observation-${{ github.event.pull_request.number }}', 'group: issue-246-self-hosted-observation-${{ github.event.pull_request.number }}'),
              ('name: Current-package TUN resource observation', 'name: Extended current-package TUN resource observation'),
              ("      PODLAZ_E2E_SOAK_DURATION_SECONDS: '360'", "      PODLAZ_E2E_SOAK_DURATION_SECONDS: '1800'"),
              ("      PODLAZ_E2E_SOAK_WARMUP_SECONDS: '30'", "      PODLAZ_E2E_SOAK_WARMUP_SECONDS: '120'"),
              ("      PODLAZ_E2E_SOAK_RECONNECT_WARMUP_SECONDS: '30'", "      PODLAZ_E2E_SOAK_RECONNECT_WARMUP_SECONDS: '120'"),
              ('      PODLAZ_E2E_SOAK_SAMPLE_INTERVAL_SECONDS: \'60\'\n      PODLAZ_E2E_POLKIT_RULE:', "      PODLAZ_E2E_SOAK_SAMPLE_INTERVAL_SECONDS: '60'\n      PODLAZ_E2E_SOAK_DOCTOR_EVERY_SAMPLES: '5'\n      PODLAZ_E2E_SOAK_CLEANUP_ATTEMPTS: '3'\n      PODLAZ_E2E_SOAK_CLEANUP_RETRY_SECONDS: '3'\n      PODLAZ_E2E_POLKIT_RULE:"),
              ('- name: Run short installed-package observation', '- name: Run 30-minute installed-package observation'),
              ('          name: issue-246-current-package-observation', '          name: issue-246-extended-current-package-observation'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing workflow marker: {old}')
              text = text.replace(old, new, 1)
          text = text.replace('    timeout-minutes: 90', '    timeout-minutes: 120', 1)
          text = text.replace('        timeout-minutes: 60', '        timeout-minutes: 90', 1)
          target.write_text(text, encoding='utf-8')
          PY
          rm -f -- \
            .github/issue-246-socket-protocol.patch \
            .github/workflows/issue-246-publish-socket-attribution.yml

      - name: Verify deterministic resource-soak contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/e2e/lib/tun_soak_analysis.py \
            scripts/e2e/lib/tun_soak_metrics.py \
            scripts/e2e/lib/tun_soak_process.py \
            scripts/e2e/lib/tun_soak_status.py
          python3 -m unittest \
            scripts.e2e.tests.test_tun_resource_soak_contract \
            scripts.e2e.tests.test_tun_soak_metrics \
            scripts.e2e.tests.test_tun_soak_status
          bash -n scripts/e2e/tun-resource-soak.sh
          bash -n scripts/e2e/lib/tun_soak_health.sh
          bash -n scripts/e2e/lib/tun_soak_cleanup.sh
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'podlaz issue 246 automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/e2e/lib/tun_soak_process.py \
            scripts/e2e/tests/test_tun_soak_metrics.py \
            .github/workflows/issue-246-self-hosted-observation.yml \
            .github/issue-246-socket-protocol.patch \
            .github/workflows/issue-246-publish-socket-attribution.yml
          git commit -m 'test: attribute Xray socket growth by protocol'
          git push origin HEAD:agent/issue-246-tun-resource-soak
