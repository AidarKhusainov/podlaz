name: Agent recovery review verification

on:
  push:
    branches:
      - agent/all-open-issues

permissions:
  contents: write

jobs:
  verify-and-document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/all-open-issues
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env
      - name: Document empty-candidate presentation semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/cli.md')
          text = path.read_text()
          old = '''Dry-run JSON reports `status: warn` when cleanup candidates, Network Session\nauthority requiring convergence, or incomplete inspection are present.\n'''
          new = '''Dry-run JSON reports `status: warn` when cleanup candidates, Network Session\nauthority requiring convergence, or incomplete inspection are present. In human\noutput, `No podlaz-owned recovery candidates found.` is shown only when there are\nno ordinary cleanup candidates and no retained Network Session recovery plan; a\nretained Network Session plan is rendered instead of that empty-state message.\n'''
          if text.count(old) != 1:
              raise SystemExit('docs/cli.md: recover presentation paragraph not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Race-check daemon lifecycle
        shell: bash
        run: go test -race ./internal/daemon -count=1
      - name: Verify CLI and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/app/cli -count=1
          bash scripts/ci/repository-structure.sh --final
          git diff --check
      - name: Commit verified documentation update
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-recovery-review-verification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cli.md .github/workflows/agent-recovery-review-verification.yml
          git commit -m 'docs: clarify recover empty-state semantics'
          git push origin HEAD:agent/all-open-issues
