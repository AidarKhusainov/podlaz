name: Hosted Synthetic TUN

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '29 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-synthetic-tun-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    name: Installed synthetic full-TUN
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap jq nftables systemd-container iptables
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ github.sha }}
        run: bash scripts/build-deb.sh

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedSyntheticTUN' -count=1

      - name: Instrument private connect boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/e2e/hosted-synthetic-tun.sh')
          text = path.read_text(encoding='utf-8')
          old = '''  (( connect_code == 0 )) || return "${connect_code}"
            wait_guest_status verified-active 120
            assert_verified_active_authority
          '''
          new = '''  if (( connect_code != 0 )); then
            echo 'diag.connect_command=fail'
            guest_exec python3 /workspace/scripts/e2e/lib/tun_soak_metrics.py classify-cli-error --stderr-file "${GUEST_PRIVATE}/connect.stderr" | sed 's/^/diag.cli_class=/'
            guest_exec python3 -c 'import json,re; p="/run/podlaz/diagnostics/tun-last.json";\ntry:\n d=json.load(open(p,encoding="utf-8"))\nexcept Exception:\n print("diag.report=missing")\nelse:\n for k in ("failure_phase","primary_classification"):\n  v=d.get(k,"missing"); v=v if isinstance(v,str) and re.fullmatch(r"[A-Za-z0-9_.-]+",v) else "invalid"; print("diag."+k+"="+v)'
            return "${connect_code}"
          fi
          echo 'diag.connect_command=pass'
          if ! wait_guest_status verified-active 120; then
            echo 'diag.verified_status=fail'
            return 1
          fi
          echo 'diag.verified_status=pass'
          if ! assert_verified_active_authority; then
            echo 'diag.authority=fail'
            return 1
          fi
          echo 'diag.authority=pass'
          '''
          if old not in text:
              raise SystemExit('connect boundary marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run hosted synthetic full-TUN qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-synthetic-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-synthetic-public
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-synthetic-tun.sh "${DEV_DEB}"

      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-synthetic-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-synthetic-public
        run: bash scripts/e2e/hosted-synthetic-tun.sh validate-report

      - name: Remove private qualification state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-synthetic-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: podlaz-hosted-synthetic-tun
          path: ${{ runner.temp }}/podlaz-hosted-synthetic-public/hosted-synthetic-tun.txt
          if-no-files-found: error
          retention-days: 7
