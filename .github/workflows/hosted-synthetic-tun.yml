name: Hosted Synthetic TUN

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '29 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-synthetic-tun-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    name: Installed synthetic full-TUN
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_COMMIT: ${{ github.sha }}
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Install qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap jq nftables systemd-container iptables
          bash scripts/ci/install-go-tool.sh nfpm

      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: bash scripts/build-deb.sh

      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedSyntheticTUN' -count=1

      - name: Run hosted synthetic full-TUN qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-synthetic-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-synthetic-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-synthetic-tun.sh "${DEV_DEB}"

      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-synthetic-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-synthetic-public
        run: bash scripts/e2e/hosted-synthetic-tun.sh validate-report

      - name: Remove private qualification state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-synthetic-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: podlaz-hosted-synthetic-tun
          path: ${{ runner.temp }}/podlaz-hosted-synthetic-public/hosted-synthetic-tun.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run hosted Hysteria2 full-TUN qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-hysteria2-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-hysteria2-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          PODLAZ_E2E_SYNTHETIC_PROTOCOL: hysteria2
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-synthetic-tun.sh "${DEV_DEB}"

      - name: Validate hosted Hysteria2 public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-hysteria2-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-hysteria2-public
        run: bash scripts/e2e/hosted-synthetic-tun.sh validate-report

      - name: Remove private Hysteria2 qualification state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-hysteria2-private
        run: sudo -n rm -rf "${E2E_TMP_ROOT}"

      - name: Upload public Hysteria2 qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-hosted-hysteria2-tun
          path: ${{ runner.temp }}/podlaz-hosted-hysteria2-public/hosted-synthetic-tun.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run imported typed Xray full-TUN qualification
        env:
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          set -euo pipefail
          failures=0
          for protocol in trojan shadowsocks vmess; do
            export PODLAZ_E2E_SYNTHETIC_PROTOCOL="${protocol}"
            export E2E_TMP_ROOT="${RUNNER_TEMP}/podlaz-hosted-${protocol}-private"
            export E2E_ARTIFACT_DIR="${RUNNER_TEMP}/podlaz-hosted-${protocol}-public"
            rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
            install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
            if ! bash scripts/e2e/hosted-synthetic-tun.sh "${DEV_DEB}"; then
              printf 'typed-xray-%s=result-fail\\n' "${protocol}"
              failures=$((failures + 1))
            elif ! bash scripts/e2e/hosted-synthetic-tun.sh validate-report; then
              printf 'typed-xray-%s=report-fail\\n' "${protocol}"
              failures=$((failures + 1))
            else
              printf 'typed-xray-%s=pass\\n' "${protocol}"
            fi
          done
          ((failures == 0))

      - name: Remove private imported typed Xray qualification state
        if: always()
        run: |
          sudo -n rm -rf "${RUNNER_TEMP}/podlaz-hosted-vmess-private" "${RUNNER_TEMP}/podlaz-hosted-trojan-private" "${RUNNER_TEMP}/podlaz-hosted-shadowsocks-private"

      - name: Upload imported typed Xray public evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: podlaz-hosted-typed-xray-tun
          path: |
            ${{ runner.temp }}/podlaz-hosted-vmess-public/hosted-synthetic-tun.txt
            ${{ runner.temp }}/podlaz-hosted-trojan-public/hosted-synthetic-tun.txt
            ${{ runner.temp }}/podlaz-hosted-shadowsocks-public/hosted-synthetic-tun.txt
          if-no-files-found: error
          retention-days: 7
