name: Hosted VM Terminal Boot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-vm-terminal-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Terminal boot attempt stays consumed
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DEV_DEB: dist/podlaz_0.0.0~dev-1_linux_amd64.deb
      CANDIDATE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env
      - name: Install VM qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cloud-image-utils jq nftables openssh-client qemu-system-x86 qemu-utils
          bash scripts/ci/install-go-tool.sh nfpm
      - name: Build exact candidate package
        env:
          PODLAZ_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: bash scripts/build-deb.sh
      - name: Scenario contract
        run: go test ./scripts/e2e -run '^TestHostedVMTerminalBoot' -count=1
      - name: Run terminal boot qualification
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-vm-terminal-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-vm-terminal-public
          PODLAZ_E2E_CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        run: |
          rm -rf "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          install -d -m 0700 "${E2E_TMP_ROOT}" "${E2E_ARTIFACT_DIR}"
          bash scripts/e2e/hosted-vm-terminal-boot.sh "${DEV_DEB}"
      - name: Validate public report
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-vm-terminal-private
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/podlaz-hosted-vm-terminal-public
        run: bash scripts/e2e/hosted-vm-terminal-boot.sh validate-report
      - name: Remove private VM state
        if: always()
        env:
          E2E_TMP_ROOT: ${{ runner.temp }}/podlaz-hosted-vm-terminal-private
        run: rm -rf "${E2E_TMP_ROOT}"
      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: podlaz-hosted-vm-terminal-boot
          path: ${{ runner.temp }}/podlaz-hosted-vm-terminal-public/hosted-vm-terminal-boot.txt
          if-no-files-found: error
          retention-days: 7
