name: Agent workspace export

on:
  pull_request:
  push:
    branches:
      - agent/issue-238-tun-l3-addressing

permissions:
  contents: read

jobs:
  export:
    name: Export exact branch workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output="${RUNNER_TEMP}/podlaz-workspace.tar.gz" \
            HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-agent-workspace
          path: ${{ runner.temp }}/podlaz-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
