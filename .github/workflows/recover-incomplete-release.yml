name: Recover incomplete release

on:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: write

concurrency:
  group: recover-incomplete-release-v0.2.44
  cancel-in-progress: false

jobs:
  recover:
    name: Publish replacement release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.2.44
      PREVIOUS_TAG: v0.2.43
    steps:
      - name: Create replacement tag if needed
        run: |
          set -euo pipefail
          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"; then
            comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${existing_sha}...${GITHUB_SHA}" --jq '.status')"
            case "${comparison}" in
              identical|ahead)
                echo "${TAG} already points to a commit on the repaired master history: ${existing_sha}"
                ;;
              *)
                echo "${TAG} points to ${existing_sha}, which is not an ancestor of repaired master ${GITHUB_SHA}" >&2
                exit 1
                ;;
            esac
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
            echo "created ${TAG} at ${GITHUB_SHA}"
          fi

      - name: Dispatch exact-tag release qualification
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" -f tag="${TAG}"

      - name: Wait for immutable release assets
        run: |
          set -euo pipefail
          expected_assets=(
            "podlaz_0.2.44_linux_amd64.tar.gz"
            "podlaz_0.2.44_linux_arm64.tar.gz"
            "podlaz_0.2.44_linux_amd64.deb"
            "podlaz_0.2.44_linux_arm64.deb"
            "SHA256SUMS"
          )
          expected_sorted="$(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)"

          for _ in $(seq 1 60); do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              actual_sorted="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
              if [ "${actual_sorted}" = "${expected_sorted}" ]; then
                exit 0
              fi
            fi
            sleep 20
          done

          echo "replacement release ${TAG} did not publish the exact expected asset set" >&2
          exit 1

      - name: Verify published replacement checksums
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "${download_dir}"' EXIT
          gh release download "${TAG}" --dir "${download_dir}"
          (
            cd "${download_dir}"
            sha256sum -c SHA256SUMS
          )

      - name: Remove empty failed release entry
        run: |
          set -euo pipefail
          if ! gh release view "${PREVIOUS_TAG}" >/dev/null 2>&1; then
            echo "${PREVIOUS_TAG} release entry is already absent"
            exit 0
          fi

          asset_count="$(gh release view "${PREVIOUS_TAG}" --json assets --jq '.assets | length')"
          if [ "${asset_count}" -ne 0 ]; then
            echo "refusing to remove ${PREVIOUS_TAG}: release now has ${asset_count} assets" >&2
            exit 1
          fi

          gh release delete "${PREVIOUS_TAG}" --yes
          echo "removed empty failed release entry ${PREVIOUS_TAG}; tag remains intact"
