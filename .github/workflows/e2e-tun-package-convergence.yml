name: TUN Package Convergence E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podlaz-tun-package-convergence-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package-convergence:
    name: Installed package TUN convergence
    runs-on: [self-hosted, linux, x64, vpn-e2e, ubuntu-24.04]
    environment: vpn-e2e
    timeout-minutes: 150
    env:
      PODLAZ_E2E_PROFILE_URI: ${{ secrets.PODLAZ_E2E_PROFILE_URI }}
      PODLAZ_E2E_PROFILE_URI_LIST: ${{ secrets.PODLAZ_E2E_PROFILE_URI_LIST }}
      PODLAZ_E2E_PUBLIC_IP_CHECK_URL: ${{ vars.PODLAZ_E2E_PUBLIC_IP_CHECK_URL }}
      PODLAZ_E2E_DNS_CHECK_HOST: ${{ vars.PODLAZ_E2E_DNS_CHECK_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Run installed-package convergence scenario
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          bash scripts/e2e/tun-package-convergence.sh

      - name: Purge package and E2E state
        if: always()
        shell: bash
        run: |
          sudo -n rm -f /run/systemd/system/podlazd.service.d/e2e-tun-hooks.conf >/dev/null 2>&1 || true
          sudo -n rm -rf /run/podlaz/e2e-tun-hooks >/dev/null 2>&1 || true
          sudo -n systemctl stop podlaz-e2e-foreign.service >/dev/null 2>&1 || true
          sudo -n resolvectl revert podlaz-e2e-dns0 >/dev/null 2>&1 || true
          sudo -n ip link del dev podlaz-e2e-dns0 >/dev/null 2>&1 || true
          sudo -n ip -4 rule del priority 42424 >/dev/null 2>&1 || true
          sudo -n ip -4 route flush table 42424 >/dev/null 2>&1 || true
          sudo -n nft delete table inet podlaz_e2e_foreign_guard >/dev/null 2>&1 || true
          sudo -n systemctl stop podlazd.service >/dev/null 2>&1 || true
          sudo -n apt purge -y podlaz >/dev/null 2>&1 || true
          if command -v deb-systemd-helper >/dev/null 2>&1; then
            sudo -n deb-systemd-helper purge podlazd.service >/dev/null 2>&1 || true
          fi
          sudo -n systemctl daemon-reload >/dev/null 2>&1 || true
          sudo -n systemctl reset-failed podlazd.service podlaz-e2e-foreign.service >/dev/null 2>&1 || true

      - name: Upload package convergence evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-tun-package-convergence-e2e-evidence
          path: ${{ runner.temp }}/podlaz-e2e-artifacts
          if-no-files-found: error
          retention-days: 14
