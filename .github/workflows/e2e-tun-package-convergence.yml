name: TUN Package Convergence E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podlaz-tun-package-convergence-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package-convergence:
    name: Installed package TUN convergence
    runs-on: [self-hosted, linux, x64, vpn-e2e, ubuntu-24.04]
    environment: vpn-e2e
    timeout-minutes: 150
    env:
      PODLAZ_E2E_PROFILE_URI: ${{ secrets.PODLAZ_E2E_PROFILE_URI }}
      PODLAZ_E2E_PROFILE_URI_LIST: ${{ secrets.PODLAZ_E2E_PROFILE_URI_LIST }}
      PODLAZ_E2E_PUBLIC_IP_CHECK_URL: ${{ vars.PODLAZ_E2E_PUBLIC_IP_CHECK_URL }}
      PODLAZ_E2E_DNS_CHECK_HOST: ${{ vars.PODLAZ_E2E_DNS_CHECK_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Run installed-package convergence scenario
        timeout-minutes: 115
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          bash scripts/e2e/tun-package-convergence.sh

      - name: Recover and verify clean host state
        if: always()
        timeout-minutes: 20
        shell: bash
        run: |
          PODLAZ_E2E_PURGE_PACKAGE=true \
            timeout --signal=TERM --kill-after=30s 900s \
            bash scripts/e2e/tun-package-cleanup.sh

      - name: Scan evidence before upload
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/podlaz-e2e-artifacts"
          mkdir -p "${artifact_dir}"
          mapfile -t host_needles < <(sed '/^[[:space:]]*$/d' "${RUNNER_TEMP}/podlaz-e2e-tmp/network-sensitive-values.txt" 2>/dev/null || true)
          python3 scripts/e2e/lib/redaction_scan.py \
            sensitive-values \
            "${artifact_dir}" \
            "${artifact_dir}/pre-upload-redaction-scan.txt" \
            "${PODLAZ_E2E_PROFILE_URI}" \
            "${PODLAZ_E2E_PROFILE_URI_LIST}" \
            "${host_needles[@]}"

      - name: Upload package convergence evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-tun-package-convergence-e2e-evidence
          path: ${{ runner.temp }}/podlaz-e2e-artifacts
          if-no-files-found: error
          retention-days: 14
