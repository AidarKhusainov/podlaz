name: TUN Package Convergence E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podlaz-tun-package-convergence-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package-convergence:
    name: Installed package TUN convergence
    runs-on: [self-hosted, linux, x64, vpn-e2e, ubuntu-24.04]
    environment: vpn-e2e
    timeout-minutes: 400
    env:
      PODLAZ_E2E_PROFILE_URI: ${{ secrets.PODLAZ_E2E_PROFILE_URI }}
      PODLAZ_E2E_PROFILE_URI_LIST: ${{ secrets.PODLAZ_E2E_PROFILE_URI_LIST }}
      PODLAZ_E2E_PUBLIC_IP_CHECK_URL: ${{ vars.PODLAZ_E2E_PUBLIC_IP_CHECK_URL }}
      PODLAZ_E2E_DNS_CHECK_HOST: ${{ vars.PODLAZ_E2E_DNS_CHECK_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.mod
            packaging/package-toolchain.env

      - name: Run installed-package convergence scenario
        timeout-minutes: 115
        shell: bash
        env:
          PODLAZ_E2E_KEEP_PACKAGE: 'true'
        run: |
          rm -rf "${RUNNER_TEMP}/podlaz-e2e-artifacts" "${RUNNER_TEMP}/podlaz-e2e-tmp"
          bash scripts/e2e/tun-package-convergence.sh

      - name: Run package lifecycle acceptance
        timeout-minutes: 60
        shell: bash
        run: |
          sudo -n systemctl daemon-reload
          sudo -n systemctl reset-failed podlazd.service || true
          sudo -n systemctl start podlazd.service
          bash scripts/e2e/package-lifecycle-acceptance.sh

      - name: Download latest released package for network recovery
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "gh CLI is required" >&2; exit 1; }
          arch="$(dpkg --print-architecture)"
          release_dir="${RUNNER_TEMP}/podlaz-network-recovery-release"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          gh release download \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "podlaz_*_linux_${arch}.deb" \
            --dir "${release_dir}"
          mapfile -t release_debs < <(find "${release_dir}" -maxdepth 1 -type f -name "podlaz_*_linux_${arch}.deb" -print | sort)
          if [[ "${#release_debs[@]}" -ne 1 ]]; then
            echo "expected exactly one latest-release ${arch} Debian asset, found ${#release_debs[@]}" >&2
            exit 1
          fi
          echo "PODLAZ_E2E_BASE_DEB=${release_debs[0]}" >>"${GITHUB_ENV}"

      - name: Run network-session continuity acceptance
        timeout-minutes: 75
        shell: bash
        run: bash scripts/e2e/network-recovery-package-acceptance.sh

      - name: Run network resource coexistence acceptance
        timeout-minutes: 30
        shell: bash
        run: bash scripts/e2e/network-resource-coexistence-package-acceptance.sh

      - name: Run Privacy Envelope lifecycle acceptance
        timeout-minutes: 45
        shell: bash
        run: bash scripts/e2e/privacy-envelope-lifecycle-package-acceptance.sh

      - name: Run evidence-driven reconciliation acceptance
        timeout-minutes: 60
        shell: bash
        env:
          PODLAZ_E2E_ALLOW_HOST_CHURN: 'true'
        run: bash scripts/e2e/network-reconciliation-package-acceptance.sh

      - name: Run boot continuation acceptance
        timeout-minutes: 90
        shell: bash
        run: bash scripts/e2e/boot-continuation-package-acceptance.sh

      - name: Run installed-package failure acceptance
        timeout-minutes: 30
        shell: bash
        run: bash scripts/e2e/package-failure-package-acceptance.sh

      - name: Run protected-gateway acceptance
        timeout-minutes: 15
        shell: bash
        run: bash scripts/e2e/protected-gateway-package-acceptance.sh

      - name: Run stale-link diagnostics acceptance
        timeout-minutes: 15
        shell: bash
        run: bash scripts/e2e/stale-link-package-acceptance.sh

      - name: Run strict log-window acceptance
        timeout-minutes: 5
        shell: bash
        run: bash scripts/e2e/log-window-acceptance.sh

      - name: Run remote-client acceptance
        timeout-minutes: 15
        shell: bash
        run: bash scripts/e2e/remote-client-acceptance.sh

      - name: Recover and verify clean host state
        id: cleanup
        if: always()
        timeout-minutes: 20
        shell: bash
        run: |
          PODLAZ_E2E_PURGE_PACKAGE=true \
            timeout --signal=TERM --kill-after=30s 900s \
            bash scripts/e2e/tun-package-cleanup.sh

      - name: Scan evidence before upload
        id: evidence_scan
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/podlaz-e2e-artifacts"
          mkdir -p "${artifact_dir}"
          mapfile -t host_needles < <(
            {
              hostname -f 2>/dev/null || true
              ip -o -4 addr show scope global 2>/dev/null | awk '{split($4, value, "/"); print value[1]; print $2}'
              ip -o -6 addr show scope global 2>/dev/null | awk '{split($4, value, "/"); print value[1]; print $2}'
              ip -4 route show default 2>/dev/null | awk '{for (i=1; i<=NF; i++) {if ($i=="via" || $i=="dev") print $(i+1)}}'
              resolvectl status --no-pager 2>/dev/null | awk -F: '/Current DNS Server|DNS Servers|DNS Domain/ {gsub(/^[[:space:]]+/, "", $2); for (i=1; i<=split($2, values, /[[:space:]]+/); i++) print values[i]}'
              curl -4 -fsS --max-time 30 "${PODLAZ_E2E_PUBLIC_IP_CHECK_URL}" 2>/dev/null || true
            } | sed '/^[[:space:]]*$/d' | sort -u
          )
          python3 scripts/e2e/lib/redaction_scan.py \
            sensitive-values \
            "${artifact_dir}" \
            "${artifact_dir}/pre-upload-redaction-scan.txt" \
            "${PODLAZ_E2E_PROFILE_URI}" \
            "${PODLAZ_E2E_PROFILE_URI_LIST}" \
            "${host_needles[@]}"

      - name: Remove private E2E temp state
        id: private_cleanup
        if: always()
        shell: bash
        run: sudo -n rm -rf "${RUNNER_TEMP}/podlaz-e2e-tmp"

      - name: Upload package convergence evidence
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.evidence_scan.outcome == 'success' && steps.private_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: podlaz-tun-package-convergence-e2e-evidence
          path: ${{ runner.temp }}/podlaz-e2e-artifacts
          if-no-files-found: error
          retention-days: 14
