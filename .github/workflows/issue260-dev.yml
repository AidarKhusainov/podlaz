name: Issue 260 focused CI

on:
  push:
    branches:
      - issue-260-collision-free-session-resources

permissions:
  contents: read

jobs:
  snapshot-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run snapshot policy-rule tests
        run: go test ./internal/network/snapshot -run 'PolicyRule|CollectWithRunnerMarksPolicyRuleInventory' -count=1
