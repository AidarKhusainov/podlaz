name: Issue 246 Publish Final Review Fixes

on:
  push:
    branches:
      - agent/issue-246-tun-resource-soak

permissions:
  contents: write

concurrency:
  group: issue-246-final-review-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish final review fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: agent/issue-246-tun-resource-soak
          fetch-depth: 0
          persist-credentials: true

      - name: Apply, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/issue-246-final.patch.xz.b64" <<'B64'
          
          B64
          base64 -d "${RUNNER_TEMP}/issue-246-final.patch.xz.b64" > "${RUNNER_TEMP}/issue-246-final.patch.xz"
          printf '%s  %s\n' \
            '832f13f9515ae3ca22b8f29c60b65b44b1eca8aaf43fe978d26971bdb58ab5b1' \
            "${RUNNER_TEMP}/issue-246-final.patch.xz" | sha256sum -c -
          xz -dc "${RUNNER_TEMP}/issue-246-final.patch.xz" > "${RUNNER_TEMP}/issue-246-final.patch"
          printf '%s  %s\n' \
            'e3b56a70b49cef447a2439800e354893d2fa869f72dbdaa11df98581d308eac3' \
            "${RUNNER_TEMP}/issue-246-final.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/issue-246-final.patch"
          git apply "${RUNNER_TEMP}/issue-246-final.patch"
          rm -f .github/workflows/issue-246-go-toolchain-publish.yml

          python3 -m py_compile scripts/e2e/lib/tun_soak_*.py scripts/e2e/tests/test_tun_soak_*.py
          python3 -m unittest \
            scripts.e2e.tests.test_tun_resource_soak_contract \
            scripts.e2e.tests.test_tun_soak_cleanup \
            scripts.e2e.tests.test_tun_soak_environment \
            scripts.e2e.tests.test_tun_soak_health \
            scripts.e2e.tests.test_tun_soak_isolation \
            scripts.e2e.tests.test_tun_soak_metrics \
            scripts.e2e.tests.test_tun_soak_policy_v2 \
            scripts.e2e.tests.test_tun_soak_status
          bash -n \
            scripts/e2e/lib/tun_soak_health.sh \
            scripts/e2e/lib/tun_soak_cleanup.sh \
            scripts/e2e/tun-resource-soak.sh
          find scripts/e2e -type d -name __pycache__ -prune -exec rm -rf {} +
          grep -Fx 'toolchain go1.26.5' go.mod
          test ! -e .github/workflows/issue-246-go-toolchain-publish.yml
          git diff --check

          git add -A
          git diff --cached --check
          git config user.name 'podlaz issue 246 automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: complete TUN soak acceptance hardening'
          git push origin HEAD:agent/issue-246-tun-resource-soak
